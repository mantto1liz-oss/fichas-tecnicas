<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<title>Tickets de alerta · Mantenimiento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{--bg:#f4f4f5;--card:#fff;--ink:#0a0a0a;--ink2:#27272a;--muted:#71717a;--line:#e4e4e7;--soft:#fafafa;
--ok:#15803d;--ok-s:#dcfce7;--warn:#b45309;--warn-s:#fef3c7;--bad:#b91c1c;--bad-s:#fee2e2;--info:#1d4ed8;--info-s:#dbeafe;--amber:#f2b705;
--body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;color-scheme:light}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:860px;margin:0 auto;padding:16px 16px 60px;display:grid;gap:14px}
.hero{background:#0a0a0a;color:#fff;border-radius:18px;padding:18px 20px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;border-bottom:6px solid var(--bad)}
.hero h1{margin:2px 0 0;font-size:24px;letter-spacing:-.02em}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#a1a1aa;font-weight:600}
.idb{font-family:var(--mono);font-size:12px;background:#27272a;border-radius:6px;padding:2px 8px;display:inline-block;margin-top:6px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:8px;min-height:42px}
.btn.amber{background:var(--amber);color:#1a1400}.btn.red{background:var(--bad)}.btn.green{background:var(--ok)}
.btn.light{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:6px 12px;min-height:34px;font-size:14px}
.btn:disabled{opacity:.55;cursor:default}
.hero .btn.light{background:transparent;color:#fff;border-color:#3f3f46}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{display:block;font-size:28px;line-height:1.1}.kpi span{font-size:13px;color:var(--muted)}
.kpi.a b{color:var(--bad)}.kpi.p b{color:var(--warn)}.kpi.r b{color:var(--ok)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.card-h{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.card-h h2{margin:0;font-size:16px}.card-b{padding:16px;display:grid;gap:12px}
.f{display:grid;gap:5px}.f label{font-size:13px;font-weight:600;color:var(--ink2)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--soft)}
textarea{min-height:90px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;font-size:14px}
.tab[aria-pressed=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tk{padding:14px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.tk:first-child{border-top:0}
.tk-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.folio{font-family:var(--mono);font-weight:600}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.st-Abierto{background:var(--bad-s);color:var(--bad)}.st-En{background:var(--warn-s);color:var(--warn)}.st-Realizado{background:var(--ok-s);color:var(--ok)}
.pr-Alta{background:var(--bad);color:#fff}.pr-Media{background:var(--amber);color:#1a1400}.pr-Baja{background:var(--line);color:var(--ink2)}
.meta{font-size:13px;color:var(--muted)}
.tk p{margin:0;white-space:pre-wrap}
.sol{background:var(--ok-s);border-radius:10px;padding:10px 12px;font-size:14px}
.msg{padding:10px 14px;border-radius:12px;font-size:14px;font-weight:500}
.msg.ok{background:var(--ok-s);color:var(--ok)}.msg.err{background:var(--bad-s);color:var(--bad)}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.who{font-size:14px;color:#d4d4d8}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:r .7s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
.help{margin:0;font-size:13px;color:var(--muted)}
@media(max-width:520px){.kpi b{font-size:22px}.hero h1{font-size:20px}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Cargando tickets…</div></div>
<script>
(function(){
var F_CONFIG='config.txt',IT=600000,DIR_T='tickets/',DIR_E='equipos/';
var CFG=null,SES=null,AREA='',NOMBRE='',TK=[],notice=null,busy=false,tab='pend',vista='lista',cerrando=null;
function tEsc(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n')}
function tUnesc(v){return v.replace(/\\(n|\\)/g,function(m,c){return c==='n'?'\n':'\\'})}
function tNum(v){return /^-?\d+(\.\d+)?$/.test(v)?Number(v):v}
function lineas(txt,cb){
  var sec=null,arg='';
  String(txt||'').replace(/^﻿/,'').split(/\r?\n/).forEach(function(raw){
    var l=raw.trim(); if(!l||l.charAt(0)==='#')return;
    var m=l.match(/^\[([A-ZÁÉÍÓÚa-z]+)\s*(.*)\]$/); if(m){sec=m[1].toUpperCase();arg=m[2].trim();cb(sec,arg,null,null,true);return}
    var i=l.indexOf('='); if(i<0)return;
    cb(sec,arg,l.slice(0,i).trim(),tUnesc(l.slice(i+1).trim()),false);
  });
}
/* config.txt (o la sección [CONFIG] de datos.txt) */
function leerConfig(txt){
  var c={},us=[],cur=null;
  lineas(txt,function(sec,arg,k,v,head){
    if(head){if(sec==='USUARIO'){cur={u:arg.toLowerCase(),nombre:'',rol:'tecnico',it:IT};us.push(cur)}return}
    if(sec==='CONFIG')c[k]=v;
    else if(sec==='USUARIO'){if(k==='nombre')cur.nombre=v;else if(k==='rol')cur.rol=v;else if(k==='sal')cur.s=v;else if(k==='iv')cur.iv=v;else if(k==='llave_cifrada')cur.ct=v;else if(k==='iteraciones')cur.it=Number(v)||IT}
  });
  if(!c.token_cifrado)return null;
  return {owner:c.cuenta_github,repo:c.repositorio,branch:c.rama||'main',tiv:c.token_iv,tct:c.token_cifrado,usuarios:us};
}
function b64e(u8){var s='';for(var i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)}
function b64d(s){var b=atob(String(s).replace(/\s/g,'')),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function llavePw(pw,salt,it){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function llaveMaestra(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
async function aesCifrar(key,bytes){var iv=crypto.getRandomValues(new Uint8Array(12));var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,bytes));return {iv:b64e(iv),ct:b64e(ct)}}
async function aesDescifrar(key,iv,ct){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(iv)},key,b64d(ct)))}
async function envolverUsuario(kraw,u,nombre,rol,pw){var salt=crypto.getRandomValues(new Uint8Array(16)),k=await llavePw(pw,salt,IT),e=await aesCifrar(k,kraw);return {u:u,nombre:nombre,rol:rol,s:b64e(salt),iv:e.iv,ct:e.ct,it:IT}}
async function cifrarToken(kraw,token){var e=await aesCifrar(await llaveMaestra(kraw),new TextEncoder().encode(token));return {tiv:e.iv,tct:e.ct}}
async function entrar(u,pw){
  var us=CFG.usuarios.find(function(x){return x.u===u}); if(!us)throw new Error('x');
  var kraw=await aesDescifrar(await llavePw(pw,b64d(us.s),us.it),us.iv,us.ct);
  var token=new TextDecoder().decode(await aesDescifrar(await llaveMaestra(kraw),CFG.tiv,CFG.tct));
  return {u:us.u,nombre:us.nombre,rol:us.rol,token:token,kraw:kraw};
}
function guardarSesion(){try{if(SES)sessionStorage.setItem('mto_ses',JSON.stringify({u:SES.u,nombre:SES.nombre,rol:SES.rol,token:SES.token,kraw:b64e(SES.kraw)}));else sessionStorage.removeItem('mto_ses')}catch(e){}}
function leerSesion(){try{var s=JSON.parse(sessionStorage.getItem('mto_ses')||'null');if(s){s.kraw=b64d(s.kraw);return s}}catch(e){}return null}
async function gh(method,url,body,token){
  var r=await fetch('https://api.github.com'+url,{method:method,headers:{'Authorization':'Bearer '+(token||SES.token),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  var j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){var err=new Error((j&&j.message)||('HTTP '+r.status));err.status=r.status;throw err}
  return j;
}
function rutaRepo(){var parts=location.pathname.split('/').filter(Boolean);parts.shift();if(parts.length&&/\.html?$/i.test(parts[parts.length-1]))parts.pop();return parts.length?parts.join('/')+'/':''}
function api(cfg,path){return '/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+(rutaRepo()+path).split('/').map(encodeURIComponent).join('/')}
/* Lee el archivo más reciente, aplica el cambio y lo sube. cambio(textoActual|null) -> textoNuevo */
async function escribir(cfg,path,cambio,mensaje,token){
  for(var intento=0;intento<2;intento++){
    var f=null;
    try{f=await gh('GET',api(cfg,path)+'?ref='+encodeURIComponent(cfg.branch),null,token)}catch(e){if(e.status!==404)throw e}
    var nuevo=cambio(f?new TextDecoder().decode(b64d(f.content)):null);
    var body={message:mensaje,content:b64e(new TextEncoder().encode(nuevo)),branch:cfg.branch};
    if(f)body.sha=f.sha;
    try{await gh('PUT',api(cfg,path),body,token);return nuevo}catch(e){if(e.status!==409||intento===1)throw e}
  }
}
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function txtFetch(p){return fetch(p+(p.indexOf('?')<0?'?':'&')+'v='+Date.now(),{cache:'no-store'}).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})}
function ahora(){var d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())}
var MES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function fF(s){if(!s)return '—';var m=String(s).match(/^(\d{4})-(\d\d)-(\d\d)\s*(.*)$/);return m?(+m[3])+' '+MES[+m[2]-1]+' '+m[1]+(m[4]?' · '+m[4]:''):s}
function horas(a,b){var x=new Date(String(a).replace(' ','T')),y=new Date(String(b).replace(' ','T'));if(isNaN(x)||isNaN(y))return '';var m=Math.max(0,Math.round((y-x)/6e4));return m<60?m+' min':m<1440?(m/60).toFixed(1)+' h':(m/1440).toFixed(1)+' días'}
function puedeCerrar(){return SES&&(SES.rol==='admin'||SES.rol==='tecnico')}

/* ── Archivo tickets/<AREA>.txt ── */
var CAMPOS=['folio','estado','prioridad','lugar','descripcion','reporta','creado','creado_por','atiende','inicio','cierre','cerro_por','solucion'];
function leerTickets(txt){
  var out=[],cur=null;
  lineas(txt,function(sec,arg,k,v,head){
    if(head){if(sec==='TICKET'){cur={};out.push(cur)}return}
    if(sec==='TICKET'&&cur)cur[k]=v;
  });
  out.forEach(function(t,i){if(!t.folio)t.folio='T-'+String(i+1).padStart(4,'0');if(!t.estado)t.estado='Abierto'});
  return out;
}
function escribirTickets(l){
  var c={a:0,p:0,r:0};l.forEach(function(t){if(t.estado==='Realizado')c.r++;else if(t.estado==='En proceso')c.p++;else c.a++});
  var L=['# ==========================================================','# TICKETS DE ALERTA · '+AREA+' · '+NOMBRE,'# Estados: Abierto -> En proceso -> Realizado','# Actualizado: '+ahora(),'# Abiertos: '+c.a+' · En proceso: '+c.p+' · Realizados: '+c.r,'# ==========================================================','',
    '# ---------------- ÍNDICE ('+l.length+') ----------------','# Folio  | Estado      | Prioridad | Creado           | Lugar'];
  l.forEach(function(t){L.push('# '+t.folio+' | '+(t.estado+'           ').slice(0,11)+' | '+(t.prioridad+'         ').slice(0,9)+' | '+(t.creado||'')+' | '+tEsc(t.lugar))});
  L.push('');
  l.forEach(function(t){L.push('[TICKET '+t.folio.replace(/^T-/,'')+']');CAMPOS.forEach(function(k){if(t[k]!==undefined&&t[k]!=='')L.push(k+' = '+tEsc(t[k]))});L.push('')});
  return L.join('\r\n');
}
function siguiente(l){var n=0;l.forEach(function(t){var m=String(t.folio).match(/(\d+)$/);if(m)n=Math.max(n,+m[1])});return 'T-'+String(n+1).padStart(4,'0')}
function ruta(){return DIR_T+AREA+'.txt'}
function cambiar(fn,msg,ok){
  busy=true;notice=null;render();
  return escribir(CFG,ruta(),function(actual){var l=actual?leerTickets(actual):TK.slice();fn(l);return escribirTickets(l)},msg+' · '+AREA+' · '+SES.u)
   .then(function(t){TK=leerTickets(t);notice={ok:true,t:ok};return true})
   .catch(function(e){notice={ok:false,t:errTxt(e)};return false})
   .then(function(r){busy=false;render();window.scrollTo({top:0,behavior:'smooth'});return r});
}
function errTxt(e){
  if(e.status===401)return 'El token de GitHub venció. El administrador debe renovarlo.';
  if(e.status===403||e.status===404)return 'El token no tiene permiso para escribir en el repositorio.';
  if(e.status===409)return 'Otra persona guardó al mismo tiempo. Intenta de nuevo.';
  if(e instanceof TypeError)return 'Sin conexión a internet. Intenta de nuevo.';
  return 'No se pudo guardar: '+e.message;
}
/* Agrega el trabajo a la bitácora del área (equipos/<AREA>.txt) */
async function aBitacora(t){
  await escribir(CFG,DIR_E+AREA+'.txt',function(actual){
    if(!actual)throw new Error('No existe la ficha '+AREA);
    var n=(actual.match(/^\[REGISTRO\s/gm)||[]).length+1;
    var L=['','[REGISTRO '+String(n).padStart(4,'0')+']','id = tk-'+t.folio,'fecha = '+t.cierre.slice(0,10),'tipo = Mantenimiento correctivo','tecnico = '+tEsc(SES.nombre),'usuario = '+SES.u,'horometro = ',
      'actividad = '+tEsc('Ticket '+t.folio+' · '+t.lugar+': '+t.descripcion),'observaciones = '+tEsc('Solución: '+t.solucion+' · Reportó: '+t.reporta+' el '+t.creado),''];
    return actual.replace(/\s*$/,'')+'\r\n'+L.join('\r\n');
  },'Registro por ticket '+t.folio+' · '+AREA+' · '+SES.u);
}

/* ── Vistas ── */
function heroHTML(){
  return '<section class="hero"><div><div class="eyebrow">Tickets de alerta · Mantenimiento Planta 1</div><h1>'+esc(NOMBRE)+'</h1><span class="idb">'+esc(AREA)+'</span></div>'+
   '<div class="row">'+(SES?'<span class="who">'+esc(SES.nombre)+' · '+(SES.rol==='admin'?'Administrador':SES.rol==='tecnico'?'Técnico':'Usuario')+'</span><button class="btn light sm" data-a="salir">Salir</button>':'<button class="btn light sm" data-a="login">Entrar</button>')+'</div></section>';
}
function kpisHTML(){
  var a=TK.filter(function(t){return t.estado==='Abierto'}).length,p=TK.filter(function(t){return t.estado==='En proceso'}).length,r=TK.filter(function(t){return t.estado==='Realizado'}).length;
  return '<div class="kpis"><div class="kpi a"><b>'+a+'</b><span>Abiertos</span></div><div class="kpi p"><b>'+p+'</b><span>En proceso</span></div><div class="kpi r"><b>'+r+'</b><span>Realizados</span></div></div>';
}
function tkHTML(t){
  var st=t.estado==='En proceso'?'En':t.estado;
  var h='<div class="tk"><div class="tk-top"><span class="folio">'+esc(t.folio)+'</span><span class="pill st-'+st+'">'+esc(t.estado)+'</span><span class="pill pr-'+esc(t.prioridad||'Media')+'">'+esc(t.prioridad||'Media')+'</span><b>'+esc(t.lugar)+'</b></div>'+
   '<p>'+esc(t.descripcion)+'</p><div class="meta">Reportó '+esc(t.reporta)+' · '+esc(fF(t.creado))+(t.atiende?' · Atiende '+esc(t.atiende):'')+(t.inicio?' desde '+esc(fF(t.inicio)):'')+'</div>';
  if(t.estado==='Realizado')h+='<div class="sol"><b>Realizado</b> '+esc(fF(t.cierre))+(t.cerro_por?' por @'+esc(t.cerro_por):'')+(t.creado&&t.cierre?' · tiempo de atención '+esc(horas(t.creado,t.cierre)):'')+'<br>'+esc(t.solucion)+'</div>';
  if(puedeCerrar()){
    if(cerrando===t.folio)h+='<div class="f"><label for="sol">¿Qué se hizo para repararlo?</label><textarea id="sol" placeholder="Ej. Se cambió banda y se ajustó tensión"></textarea></div>'+
      '<label class="row meta"><input type="checkbox" id="bit" checked style="width:auto"> Agregar también a la bitácora de '+esc(AREA)+'</label>'+
      '<div class="row"><button class="btn green sm" data-a="cerrar-ok" data-f="'+esc(t.folio)+'"'+(busy?' disabled':'')+'>'+(busy?'<i class="spin"></i>Guardando…':'✓ Confirmar realizado')+'</button><button class="btn light sm" data-a="cerrar-no">Cancelar</button></div>';
    else if(t.estado==='Abierto')h+='<div class="row"><button class="btn amber sm" data-a="tomar" data-f="'+esc(t.folio)+'"'+(busy?' disabled':'')+'>Atender (En proceso)</button><button class="btn green sm" data-a="cerrar" data-f="'+esc(t.folio)+'">Marcar realizado</button></div>';
    else if(t.estado==='En proceso')h+='<div class="row"><button class="btn green sm" data-a="cerrar" data-f="'+esc(t.folio)+'">Marcar realizado</button></div>';
    else if(SES.rol==='admin')h+='<div class="row"><button class="btn light sm" data-a="reabrir" data-f="'+esc(t.folio)+'"'+(busy?' disabled':'')+'>Reabrir</button></div>';
  }
  return h+'</div>';
}
function listaHTML(){
  var l=TK.slice().reverse().filter(function(t){return tab==='todos'||(tab==='pend'?t.estado!=='Realizado':t.estado==='Realizado')});
  var orden={Alta:0,Media:1,Baja:2};if(tab==='pend')l.sort(function(a,b){return (orden[a.prioridad]||1)-(orden[b.prioridad]||1)});
  function b(v,t){return '<button class="tab" data-a="tab" data-v="'+v+'" aria-pressed="'+(tab===v)+'">'+t+'</button>'}
  return '<div class="card"><div class="card-h"><h2>Tickets</h2><div class="tabs">'+b('pend','Pendientes')+b('hechos','Realizados')+b('todos','Todos')+'</div></div>'+
   (l.length?l.map(tkHTML).join(''):'<div class="empty">'+(tab==='pend'?'Sin alertas pendientes. Todo en orden.':'No hay tickets aquí todavía.')+'</div>')+'</div>';
}
function nuevoHTML(){
  if(!SES)return '<div class="card"><div class="card-b"><b>¿Algo falla en '+esc(NOMBRE)+'?</b><p class="help">Para levantar un ticket entra con tu usuario. Si no tienes, avisa a tu supervisor o a mantenimiento.</p><div class="row"><button class="btn red" data-a="login">⚠ Reportar una falla</button></div></div></div>';
  return '<form class="card" id="nf" novalidate><div class="card-h"><h2>⚠ Nuevo ticket de alerta</h2></div><div class="card-b">'+
   '<div class="fgrid"><div class="f"><label for="t-lugar">Máquina o lugar</label><input id="t-lugar" placeholder="Ej. Máquina de coser #4, grapadora línea 2"></div>'+
   '<div class="f"><label for="t-pri">Prioridad</label><select id="t-pri"><option>Alta</option><option selected>Media</option><option>Baja</option></select></div></div>'+
   '<div class="f"><label for="t-desc">¿Qué falla?</label><textarea id="t-desc" placeholder="Describe la falla: qué pasa, desde cuándo, si está parada la máquina"></textarea></div>'+
   '<div class="f"><label for="t-rep">Quién reporta</label><input id="t-rep" value="'+esc(SES.nombre)+'"></div>'+
   '<p class="help">Alta = máquina parada o riesgo de seguridad · Media = falla que permite trabajar · Baja = detalle o mejora.</p>'+
   '<div class="row"><button class="btn red" type="submit"'+(busy?' disabled':'')+'>'+(busy?'<i class="spin"></i>Enviando…':'Enviar ticket')+'</button></div></div></form>';
}
function loginHTML(){
  return heroHTML()+'<form class="card" id="lf" novalidate><div class="card-h"><h2>Entrar</h2></div><div class="card-b">'+(notice?'<div class="msg '+(notice.ok?'ok':'err')+'">'+esc(notice.t)+'</div>':'')+
   '<div class="fgrid"><div class="f"><label for="l-u">Usuario</label><input id="l-u" autocapitalize="off" autocomplete="username"></div><div class="f"><label for="l-p">Contraseña</label><input id="l-p" type="password" autocomplete="current-password"></div></div>'+
   '<div class="row"><button class="btn" type="submit"'+(busy?' disabled':'')+'>'+(busy?'<i class="spin"></i>Verificando…':'Entrar')+'</button><button class="btn light" type="button" data-a="volver">Volver</button></div></div></form>';
}
function render(){
  var app=$('app');
  if(!CFG&&!TK.length&&vista==='carga'){app.innerHTML='<div class="empty">Cargando tickets…</div>';return}
  if(vista==='login'){app.innerHTML=loginHTML();var u=$('l-u');if(u&&!busy&&!u.value)u.focus();return}
  var keep={};['t-lugar','t-pri','t-desc','t-rep','sol'].forEach(function(i){var e=$(i);if(e)keep[i]=e.value});
  app.innerHTML=heroHTML()+(notice?'<div class="msg '+(notice.ok?'ok':'err')+'">'+esc(notice.t)+'</div>':'')+kpisHTML()+nuevoHTML()+listaHTML()+
   '<div class="row" style="justify-content:space-between"><a class="meta" href="./?equipo='+encodeURIComponent(AREA)+'">Ver ficha y bitácora de '+esc(AREA)+' ↗</a><button class="btn light sm" data-a="recargar">↻ Actualizar</button></div>';
  Object.keys(keep).forEach(function(i){var e=$(i);if(e)e.value=keep[i]});
}
async function cargar(){
  var p=new URLSearchParams(location.search);
  AREA=String(p.get('area')||p.get('equipo')||'AREA-TAPICERIA-001').toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,30);
  var r=await Promise.all([txtFetch(F_CONFIG).catch(function(){return null}),txtFetch(DIR_T+AREA+'.txt').catch(function(){return null}),txtFetch('equipos.txt').catch(function(){return null})]);
  CFG=r[0]?leerConfig(r[0]):null;TK=r[1]?leerTickets(r[1]):[];
  NOMBRE=AREA;if(r[2]){var m=r[2].match(new RegExp('^'+AREA+'\\s*=\\s*([^|\\r\\n]*)','m'));if(m)NOMBRE=m[1].trim()}
  var ar=AREA.match(/^AREA-([A-Z]+)/);if(ar){var N={TAPICERIA:'Tapicería',COSTURA:'Costura',DISEO:'Diseño',CORTE:'Corte',LLENADO:'Llenado',ALMACEN:'Almacén',EMBARQUES:'Embarques'};NOMBRE='Área de '+(N[ar[1]]||ar[1].charAt(0)+ar[1].slice(1).toLowerCase())}
  document.title='Tickets · '+NOMBRE;
  if(vista!=='login')vista='lista';render();
}
document.addEventListener('submit',async function(ev){
  ev.preventDefault();if(busy)return;
  if(ev.target.id==='lf'){
    var u=$('l-u').value.trim().toLowerCase(),pw=$('l-p').value;
    if(!CFG){notice={ok:false,t:'No se encontró config.txt.'};render();return}
    busy=true;notice=null;render();
    try{SES=await entrar(u,pw);guardarSesion();vista='lista';notice={ok:true,t:'Bienvenido, '+SES.nombre+'.'}}catch(e){notice={ok:false,t:'Usuario o contraseña incorrectos.'}}
    busy=false;render();
  }
  if(ev.target.id==='nf'){
    var lugar=$('t-lugar').value.trim(),desc=$('t-desc').value.trim(),rep=$('t-rep').value.trim(),pri=$('t-pri').value;
    if(!lugar||!desc||!rep){notice={ok:false,t:'Llena máquina o lugar, qué falla y quién reporta.'};render();return}
    var folio='';
    var ok=await cambiar(function(l){folio=siguiente(l);l.push({folio:folio,estado:'Abierto',prioridad:pri,lugar:lugar,descripcion:desc,reporta:rep,creado:ahora(),creado_por:SES.u})},'Nuevo ticket','Ticket creado. Mantenimiento ya lo puede ver.');
    if(ok){notice.t='Ticket '+folio+' creado. Mantenimiento ya lo puede ver.';['t-lugar','t-desc'].forEach(function(i){var e=$(i);if(e)e.value=''});render()}
  }
});
document.addEventListener('click',async function(ev){
  var b=ev.target.closest('[data-a]');if(!b||busy)return;var a=b.dataset.a,f=b.dataset.f;
  if(a==='login'){vista='login';notice=null;render()}
  else if(a==='volver'){vista='lista';notice=null;render()}
  else if(a==='salir'){SES=null;guardarSesion();notice=null;cerrando=null;render()}
  else if(a==='tab'){tab=b.dataset.v;render()}
  else if(a==='recargar'){notice=null;cargar()}
  else if(a==='tomar'&&puedeCerrar()){await cambiar(function(l){var t=l.find(function(x){return x.folio===f});if(t&&t.estado==='Abierto'){t.estado='En proceso';t.atiende=SES.nombre;t.inicio=ahora()}},'Atiende '+f,'Ticket '+f+' en proceso.')}
  else if(a==='cerrar'&&puedeCerrar()){cerrando=f;render();var s=$('sol');if(s)s.focus()}
  else if(a==='cerrar-no'){cerrando=null;render()}
  else if(a==='cerrar-ok'&&puedeCerrar()){
    var sol=$('sol').value.trim(),bit=$('bit').checked,hecho=null;
    if(!sol){notice={ok:false,t:'Escribe qué se hizo para repararlo.'};render();return}
    var ok=await cambiar(function(l){var t=l.find(function(x){return x.folio===f});if(t){t.estado='Realizado';t.cierre=ahora();t.cerro_por=SES.u;t.solucion=sol;if(!t.atiende)t.atiende=SES.nombre;if(!t.inicio)t.inicio=t.cierre;hecho=Object.assign({},t)}},'Cierra '+f,'Ticket '+f+' realizado.');
    if(ok){cerrando=null;if(bit&&hecho){try{await aBitacora(hecho);notice={ok:true,t:'Ticket '+f+' realizado y agregado a la bitácora.'}}catch(e){notice={ok:false,t:'El ticket quedó realizado, pero no se pudo agregar a la bitácora: '+errTxt(e)}}}render()}
  }
  else if(a==='reabrir'&&SES&&SES.rol==='admin'){await cambiar(function(l){var t=l.find(function(x){return x.folio===f});if(t){t.estado='Abierto';['cierre','cerro_por','solucion','atiende','inicio'].forEach(function(k){delete t[k]})}},'Reabre '+f,'Ticket '+f+' reabierto.')}
});
SES=leerSesion();vista='carga';cargar();
})();
</script>
</body>
</html>
