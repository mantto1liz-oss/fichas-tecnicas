<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fichas Técnicas · Mantenimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f8fafc; --ink:#0f172a; --muted:#64748b; --line:#e2e8f0;
  --side:#0d1828; --side-2:#13223a; --side-ink:#c5cfdd; --side-muted:#7a889d;
  --accent:#f2b705; --accent-ink:#1a1400; --accent-soft:rgba(242,183,5,.14);
  --navy:#13223a; --ok:#15803d; --ok-soft:#dcfce7; --warn:#b45309; --warn-soft:#fef3c7; --bad:#b91c1c; --bad-soft:#fee2e2;
  --info:#1d4ed8; --info-soft:#dbeafe;
  --shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.06);
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1119; --surface:#121a25; --surface-2:#0f1620; --ink:#e5eaf1; --muted:#94a3b8; --line:#223042;
  --side:#080e17; --side-2:#0f1a2a;
  --ok:#4ade80; --ok-soft:rgba(74,222,128,.12); --warn:#fbbf24; --warn-soft:rgba(251,191,36,.12); --bad:#f87171; --bad-soft:rgba(248,113,113,.12);
  --info:#60a5fa; --info-soft:rgba(96,165,250,.12); --shadow:none; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.ic{width:18px;height:18px;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ───── Botones ───── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px/1 var(--body);border-radius:9px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);transition:background .15s,border-color .15s,box-shadow .15s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn .ic{width:16px;height:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(.96)}
.btn.dark{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent);background:transparent}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btn:disabled{opacity:.55;cursor:default}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav-i:focus-visible,.tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link{background:none;border:0;padding:0;color:var(--info);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}

/* ───── Login ───── */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.auth-brand{position:relative;overflow:hidden;background:radial-gradient(120% 90% at 0% 0%,#1d3557 0%,var(--side) 60%);color:#fff;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.auth-brand::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,transparent 14px 28px);opacity:.9}
.auth-pitch{display:grid;gap:16px;max-width:520px}
.auth-pitch h1{font-size:clamp(28px,3.2vw,40px);line-height:1.1;margin:0;letter-spacing:-.02em;text-wrap:balance}
.auth-pitch p{margin:0;color:#b8c4d6;font-size:15px;max-width:440px}
.feats{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:12px}
.feats li{display:flex;align-items:center;gap:12px;color:#dbe3ee}
.feats .ic{width:34px;height:34px;padding:8px;border-radius:9px;background:rgba(255,255,255,.08);color:var(--accent)}
.auth-foot{display:flex;flex-wrap:wrap;gap:8px;position:relative;z-index:1}
.auth-main{display:grid;place-items:center;padding:40px 24px;background:var(--surface)}
.auth-card{width:100%;max-width:400px;display:grid;gap:18px}
.auth-card.wide{max-width:600px}
.auth-card .fgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:480px){.auth-card .fgrid{grid-template-columns:1fr}}
.auth-head h2{margin:0 0 4px;font-size:24px;letter-spacing:-.01em}
.auth-head p{margin:0;color:var(--muted)}
.sep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.loading{min-height:100vh;display:grid;place-items:center;gap:16px;text-align:center;color:var(--muted)}
.loading .logo{width:52px;height:52px;margin:0 auto 12px;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(.92);opacity:.7}}

/* ───── Marca ───── */
.brand{display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.logo .ic{width:22px;height:22px}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--side-muted);font-size:12px}
.eyebrow{font:600 11px/1.2 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.tag{font:600 12px/1 var(--mono);padding:7px 10px;border-radius:7px;background:rgba(255,255,255,.1);color:#e6ecf4}
.tag.id{background:var(--accent);color:var(--accent-ink)}

/* ───── Estructura del panel ───── */
.app{display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);color:var(--side-ink);display:flex;flex-direction:column;gap:6px;padding:20px 14px;overflow-y:auto;z-index:30}
.side .brand{padding:2px 8px 16px;border-bottom:1px solid rgba(255,255,255,.07);margin-bottom:6px}
.nav{display:grid;gap:2px}
.nav-h{font:600 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--side-muted);padding:16px 12px 8px}
.nav-i{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:9px;background:none;color:var(--side-ink);font:500 14px/1.2 var(--body);text-align:left;transition:background .15s,color .15s}
.nav-i:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-i[aria-current="page"]{background:var(--accent-soft);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav-i[aria-current="page"] .ic{color:var(--accent)}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.07);display:grid;gap:12px}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px;min-width:0}
.me b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--side-muted);font-size:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,#2b4a72,#1b3150);color:#fff;display:grid;place-items:center;font:600 13px/1 var(--body);flex:none}
.side .btn{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.1);color:var(--side-ink)}
.side .btn:hover{background:rgba(255,255,255,.1);color:#fff}
.side .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;min-height:68px;padding:12px 32px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:19px;letter-spacing:-.01em;line-height:1.2}
.crumb{font-size:12px;color:var(--muted)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.burger{display:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px}
.content{padding:28px 32px 56px;display:grid;gap:22px;width:100%;max-width:1280px}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:6px 10px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.badge.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.badge.admin{background:var(--accent-soft);color:var(--warn);border-color:transparent}

/* ───── Tarjetas ───── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
.card-h h3 .ic{color:var(--muted)}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:500}
.card-b{padding:20px;display:grid;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

.hero{position:relative;overflow:hidden;border-radius:16px;padding:26px 28px 30px;color:#fff;background:radial-gradient(120% 140% at 100% 0%,#24476f 0%,var(--navy) 55%,var(--side) 100%);display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(-45deg,var(--accent) 0 12px,transparent 12px 24px)}
.hero h2{margin:6px 0 12px;font-size:clamp(22px,2.4vw,30px);line-height:1.15;letter-spacing:-.02em}
.hero .tags{display:flex;flex-wrap:wrap;gap:8px}
.hero-side{display:grid;gap:4px;text-align:right;color:#b8c4d6;font-size:13px}
.hero-side b{color:#fff;font-size:15px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.kpi{padding:18px 20px;display:grid;gap:4px;align-content:start}
.kpi-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:6px}
.kpi-ic{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--info-soft);color:var(--info)}
.kpi-ic.y{background:var(--accent-soft);color:var(--warn)} .kpi-ic.g{background:var(--ok-soft);color:var(--ok)} .kpi-ic.r{background:var(--bad-soft);color:var(--bad)}
.kpi .v{font:600 24px/1.2 var(--mono);letter-spacing:-.01em}
.kpi .s{font-size:12px;color:var(--muted)}

.gauges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.g{border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:12px 14px;display:grid;gap:4px}
.g .k{font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:space-between;gap:6px}
.g .v{font:600 19px/1.2 var(--mono)}
.g .v small{font:500 12px var(--body);color:var(--muted);margin-left:3px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:none}
.dot.w{background:var(--warn)} .dot.b{background:var(--bad)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--ok);border-radius:inherit}
.bar i.w{background:var(--warn)} .bar i.b{background:var(--bad)}

.list{display:grid}
.li{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li-date{width:46px;flex:none;text-align:center;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);padding:6px 0;line-height:1.1}
.li-date b{display:block;font:600 16px var(--mono)}
.li-date span{font-size:11px;color:var(--muted);text-transform:uppercase}
.li-body{min-width:0;flex:1}
.li-body b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-body span{font-size:12px;color:var(--muted)}

dl.specs{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));column-gap:28px}
dl.specs div{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px dashed var(--line);min-width:0}
dl.specs dt{color:var(--muted);font-size:13px}
dl.specs dd{margin:0;font:600 13px/1.4 var(--mono);text-align:right;overflow-wrap:anywhere}
.mini-specs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.mini-specs div{padding:12px 14px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)}
.mini-specs span{display:block;font-size:12px;color:var(--muted)}
.mini-specs b{font:600 14px/1.35 var(--mono);overflow-wrap:anywhere}

/* ───── Bitácora ───── */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;padding:4px;border-radius:11px;background:var(--surface);border:1px solid var(--line)}
.tab{border:0;background:none;padding:8px 14px;border-radius:8px;font:500 13px/1 var(--body);color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--navy);color:#fff}
.count{font-size:13px;color:var(--muted)}
.log{display:grid;gap:14px}
.entry{padding:18px 20px;display:grid;gap:12px}
.entry-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.entry-date{display:flex;align-items:center;gap:8px;font:600 14px/1 var(--mono)}
.entry-date .ic{color:var(--muted);width:16px;height:16px}
.who{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.who .ic{width:14px;height:14px}
.entry-tools{margin-left:auto;display:flex;gap:6px}
.pill{font:600 11px/1 var(--body);letter-spacing:.04em;text-transform:uppercase;padding:6px 9px;border-radius:99px}
.pill.prev{background:var(--ok-soft);color:var(--ok)} .pill.corr{background:var(--bad-soft);color:var(--bad)}
.pill.lect{background:var(--info-soft);color:var(--info)} .pill.prue{background:var(--warn-soft);color:var(--warn)}
.acts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px 18px}
.acts li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.acts .ic{width:16px;height:16px;color:var(--ok);margin-top:2px}
.readings{display:flex;flex-wrap:wrap;gap:6px}
.rd{font:500 12px/1 var(--mono);padding:6px 9px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line)}
.rd.w{border-color:var(--warn);color:var(--warn)} .rd.b{border-color:var(--bad);color:var(--bad)}
.obs{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 12px;border-radius:9px;background:var(--surface-2);border-left:3px solid var(--line)}
.meta{font-size:13px;color:var(--muted)}
.empty{display:grid;place-items:center;gap:8px;padding:40px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;background:var(--surface)}
.empty .ic{width:28px;height:28px}

/* ───── Formularios ───── */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
.f{display:grid;gap:6px;min-width:0}
.f>label,.f>span.l{font:600 12px/1.2 var(--body);color:var(--muted)}
input,select,textarea{font:500 14px/1.3 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:10px 12px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
input[type=number],input.mono{font-family:var(--mono)}
input[readonly]{background:var(--surface-2);color:var(--muted)}
textarea{min-height:84px;resize:vertical}
.inp{position:relative;display:block}
.inp>.ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;height:17px;pointer-events:none}
.inp input{padding-left:40px;height:44px}
.inp .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;padding:6px;color:var(--muted);border-radius:7px}
.inp .eye .ic{width:17px;height:17px}
.sec-t{font:600 13px/1.2 var(--body);color:var(--ink);display:flex;align-items:center;gap:8px;padding-top:6px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:10px 12px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
.checks label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.checks input{width:16px;height:16px;margin:1px 0 0;accent-color:#c99700;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.help{font-size:12px;color:var(--muted);margin:0}
.msg{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:11px;font-size:13px;font-weight:500;border:1px solid transparent}
.msg .ic{width:18px;height:18px;margin-top:1px}
.msg.ok{background:var(--ok-soft);color:var(--ok)} .msg.err{background:var(--bad-soft);color:var(--bad)}
.spec-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:center}
.users{display:grid}
.urow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--line)}
.urow:first-child{border-top:0}
.urow .avatar{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.urow-b{flex:1;min-width:0}
.urow-b b{display:block}
.urow-b span{font-size:12px;color:var(--muted)}

/* ───── Responsivo ───── */
.content{grid-template-columns:minmax(0,1fr)}
@media (max-width:1100px){.cols,.cols.even{grid-template-columns:minmax(0,1fr)}}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .kpi{padding:14px}
  .kpi .v{font-size:19px}
  .side{position:fixed;inset:0 auto 0 0;width:272px;transform:translateX(-100%);transition:transform .22s ease}
  .menu-open .side{transform:none;box-shadow:0 0 40px rgba(0,0,0,.35)}
  .menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:25}
  .burger{display:inline-flex}
  .top{padding:10px 16px}
  .content{padding:18px 16px 48px}
  .auth{grid-template-columns:minmax(0,1fr)}
  dl.specs{grid-template-columns:minmax(0,1fr)}
  .gauges{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top h1{font-size:17px}
  .auth-brand{padding:28px 24px 36px;gap:22px}
  .feats{display:none}
}
@media (max-width:560px){
  .top-r .btn span{display:none}
  .hero{padding:22px 20px 28px}.hero-side{text-align:left}
  .spec-edit{grid-template-columns:1fr}
  .entry-tools{margin-left:0;width:100%}
}
</style>
</head>
<body>
<div id="app"></div>

<!-- Los datos del equipo viven en datos.txt, en la misma carpeta. Esta página solo los muestra y los guarda. -->
<script>
(function(){
var ARCHIVO_DATOS = 'datos.txt';
var IT = 600000;
var S = null, SES = null;   // SES = sesión: {u, nombre, rol, token, kraw}
var view = 'dash', editId = null, pendingDelete = null, pendingUser = null, notice = null, busy = false, placaTmp = null, filtro = 'todos';
var guest = false, menuOpen = false, lastKey = null, limpiar = false;
var TIPOS = ['Lectura semanal','Mantenimiento preventivo','Mantenimiento correctivo','Prueba con carga','Inspección'];

/* ───── Formato de datos.txt (legible en el Bloc de notas) ───── */
var LEC = [['comb','combustible_pct'],['aceite','presion_aceite_bar'],['temp','temp_motor_c'],['bat','baterias_v'],['rpm','rpm'],['hz','frecuencia_hz'],['kwh','energia_kwh'],['vll','v_linea_linea'],['vln','v_linea_neutro']];
function tEsc(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n')}
function tUnesc(v){return v.replace(/\\(n|\\)/g,function(m,c){return c==='n'?'\n':'\\'})}
function tNum(v){return /^-?\d+(\.\d+)?$/.test(v)?Number(v):v}
function leerTxt(txt){
  var st={equipo:{},placa:[],historial:[],cfg:null}, sec=null, cur=null, cfg={}, usuarios=[];
  txt.replace(/^﻿/,'').split(/\r?\n/).forEach(function(raw){
    var l=raw.trim(); if(!l||l.charAt(0)==='#')return;
    var m=l.match(/^\[(.+)\]$/);
    if(m){var n=m[1].trim(), N=n.toUpperCase();
      if(N.indexOf('REGISTRO')===0){sec='REG';cur={id:'',fecha:'',tipo:'',tecnico:'',usuario:'',horometro:null,actividades:[],lectura:{},refacciones:'',obs:''};st.historial.push(cur)}
      else if(N.indexOf('USUARIO')===0){sec='USR';cur={u:n.slice(7).trim().toLowerCase(),nombre:'',rol:'tecnico'};usuarios.push(cur)}
      else sec=N; return}
    var i=l.indexOf('='); if(i<0)return;
    var k=l.slice(0,i).trim(), v=tUnesc(l.slice(i+1).trim());
    if(sec==='EQUIPO')st.equipo[k]=v;
    else if(sec==='PLACA')st.placa.push([k,v]);
    else if(sec==='CONFIG')cfg[k]=v;
    else if(sec==='USR'){ if(k==='nombre')cur.nombre=v; else if(k==='rol')cur.rol=v; else if(k==='sal')cur.s=v; else if(k==='iv')cur.iv=v; else if(k==='llave_cifrada')cur.ct=v; else if(k==='iteraciones')cur.it=Number(v)||IT; }
    else if(sec==='REG'){
      if(k==='actividad')cur.actividades.push(v);
      else if(k==='horometro')cur.horometro=v===''?null:tNum(v);
      else if(k==='observaciones')cur.obs=v;
      else{var lk=LEC.find(function(p){return p[1]===k}); if(lk)cur.lectura[lk[0]]=v===''?null:tNum(v); else cur[k]=v}
    }
  });
  st.historial.forEach(function(r,i){if(!r.id)r.id='r'+(i+1)});
  if(cfg.token_cifrado)st.cfg={owner:cfg.cuenta_github,repo:cfg.repositorio,branch:cfg.rama||'main',path:cfg.archivo||ARCHIVO_DATOS,tiv:cfg.token_iv,tct:cfg.token_cifrado,usuarios:usuarios};
  return st;
}
function escribirTxt(st){
  var L=[], q=st.equipo, h=st.historial.slice().sort(function(a,b){return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0});
  function kv(k,v){L.push(k+' = '+tEsc(v))}
  L.push('# ==========================================================');
  L.push('# FICHA TÉCNICA Y BITÁCORA DE MANTENIMIENTO');
  L.push('# Equipo: '+tEsc(q.id)+' · '+tEsc(q.nombre));
  L.push('# Actualizado: '+new Date().toLocaleString('es-MX'));
  L.push('# Este archivo lo escribe index.html. Si lo editas a mano,');
  L.push('# respeta el formato  campo = valor  y los títulos [ ].');
  L.push('# ==========================================================','');
  L.push('[EQUIPO]'); Object.keys(q).forEach(function(k){kv(k,q[k])}); L.push('');
  L.push('[PLACA]'); st.placa.forEach(function(p){kv(String(p[0]).replace(/=/g,'-'),p[1])}); L.push('');
  L.push('# ---------------- ÍNDICE DE REGISTROS ('+h.length+') ----------------');
  L.push('# No.  | Fecha      | Tipo                       | Técnico');
  h.forEach(function(r,i){L.push('# '+String(i+1).padStart(4,'0')+' | '+r.fecha+' | '+(r.tipo+'                          ').slice(0,26)+' | '+tEsc(r.tecnico))});
  L.push('');
  h.forEach(function(r,i){
    L.push('[REGISTRO '+String(i+1).padStart(4,'0')+']');
    kv('id',r.id); kv('fecha',r.fecha); kv('tipo',r.tipo); kv('tecnico',r.tecnico); if(r.usuario)kv('usuario',r.usuario);
    kv('horometro',hasN(r.horometro)?r.horometro:'');
    (r.actividades||[]).forEach(function(a){kv('actividad',a)});
    LEC.forEach(function(p){var v=r.lectura&&r.lectura[p[0]]; if(hasN(v))kv(p[1],v)});
    if(r.refacciones)kv('refacciones',r.refacciones);
    if(r.obs)kv('observaciones',r.obs);
    L.push('');
  });
  if(st.cfg){var c=st.cfg;
    L.push('# ---- Acceso del modo técnico. Todo va cifrado; no modifiques estas secciones ----');
    L.push('[CONFIG]'); kv('cuenta_github',c.owner); kv('repositorio',c.repo); kv('rama',c.branch); kv('archivo',c.path);
    kv('token_iv',c.tiv); kv('token_cifrado',c.tct); L.push('');
    c.usuarios.forEach(function(u){
      L.push('[USUARIO '+u.u+']'); kv('nombre',u.nombre); kv('rol',u.rol); kv('sal',u.s); kv('iv',u.iv); kv('llave_cifrada',u.ct); kv('iteraciones',u.it); L.push('');
    });
  }
  return L.join('\r\n');
}

/* ───── Cifrado: el token se cifra con una llave maestra; cada usuario guarda esa llave cifrada con su contraseña ───── */
function b64e(u8){var s='';for(var i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)}
function b64d(s){var b=atob(String(s).replace(/\s/g,'')),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function llavePw(pw,salt,it){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function llaveMaestra(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
async function aesCifrar(key,bytes){var iv=crypto.getRandomValues(new Uint8Array(12));var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,bytes));return {iv:b64e(iv),ct:b64e(ct)}}
async function aesDescifrar(key,iv,ct){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(iv)},key,b64d(ct)))}
async function envolverUsuario(kraw,u,nombre,rol,pw){
  var salt=crypto.getRandomValues(new Uint8Array(16)), k=await llavePw(pw,salt,IT), e=await aesCifrar(k,kraw);
  return {u:u,nombre:nombre,rol:rol,s:b64e(salt),iv:e.iv,ct:e.ct,it:IT};
}
async function cifrarToken(kraw,token){var e=await aesCifrar(await llaveMaestra(kraw),new TextEncoder().encode(token));return {tiv:e.iv,tct:e.ct}}
async function entrar(u,pw){
  var us=(S.cfg.usuarios||[]).find(function(x){return x.u===u});
  if(!us)throw new Error('x');
  var kraw=await aesDescifrar(await llavePw(pw,b64d(us.s),us.it),us.iv,us.ct);
  var token=new TextDecoder().decode(await aesDescifrar(await llaveMaestra(kraw),S.cfg.tiv,S.cfg.tct));
  return {u:us.u,nombre:us.nombre,rol:us.rol,token:token,kraw:kraw};
}
function claveValida(pw){return pw.length>=10&&/[a-zA-Z]/.test(pw)&&/\d/.test(pw)}
function usuarioValido(u){return /^[a-z0-9._-]{3,20}$/.test(u)}

/* ───── GitHub: lee datos.txt, aplica el cambio y lo vuelve a subir ───── */
async function gh(token,method,url,body){
  var r=await fetch('https://api.github.com'+url,{method:method,headers:{'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  var j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){var err=new Error((j&&j.message)||('HTTP '+r.status));err.status=r.status;throw err}
  return j;
}
function rutaApi(cfg){return '/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+cfg.path.split('/').map(encodeURIComponent).join('/')}
async function confirmar(cfg,token,cambio,mensaje){
  for(var intento=0;intento<2;intento++){
    var f=null, st;
    try{ f=await gh(token,'GET',rutaApi(cfg)+'?ref='+encodeURIComponent(cfg.branch)); }
    catch(e){ if(e.status!==404||!S)throw e; }
    st = f ? leerTxt(new TextDecoder().decode(b64d(f.content))) : JSON.parse(JSON.stringify(S));
    cambio(st);
    try{
      var body={message:mensaje,content:b64e(new TextEncoder().encode(escribirTxt(st))),branch:cfg.branch};
      if(f)body.sha=f.sha;
      await gh(token,'PUT',rutaApi(cfg),body);
      return st;
    }catch(e){ if(e.status!==409||intento===1)throw e; }
  }
}
function errorTexto(e){
  if(e.status===401)return 'El token de GitHub ya no es válido o venció. El administrador debe renovarlo en Usuarios → Renovar token.';
  if(e.status===403||e.status===404)return 'El token no tiene permiso para escribir en este repositorio. Revisa que tenga "Contents: Read and write".';
  if(e.status===409)return 'Otra persona guardó al mismo tiempo. Intenta de nuevo.';
  if(e instanceof TypeError)return 'Sin conexión a internet. Intenta de nuevo.';
  return 'No se pudo guardar: '+e.message;
}

var GAUGES=[['comb','Combustible','%'],['aceite','Presión de aceite','bar'],['temp','Temp. del motor','°C'],['bat','Baterías','V'],['rpm','Velocidad','RPM'],['hz','Frecuencia','Hz'],['kwh','Energía','kWh'],['vll','Voltaje L-L','V'],['vln','Voltaje L-N','V']];
function estado(k,v){
  v=+v; if(isNaN(v))return '';
  if(k==='comb')return v<25?'b':v<50?'w':'';
  if(k==='aceite')return v<1.5?'b':v<2?'w':'';
  if(k==='temp')return v>90?'b':v>75?'w':'';
  if(k==='bat')return (v<22||v>29)?'w':'';
  if(k==='hz')return Math.abs(v-60)>1?'w':'';
  return '';
}
function readings(l){
  if(!l)return '';var o=[];
  function add(k,t){o.push('<span class="rd '+estado(k,l[k])+'">'+esc(t)+'</span>')}
  if(hasN(l.comb))add('comb','Comb '+l.comb+' %');
  if(hasN(l.aceite))add('aceite','Aceite '+l.aceite+' bar');
  if(hasN(l.temp))add('temp','Temp '+l.temp+' °C');
  if(hasN(l.bat))add('bat','Bat '+l.bat+' V');
  if(hasN(l.rpm))add('rpm',l.rpm+' RPM');
  if(hasN(l.hz))add('hz',l.hz+' Hz');
  if(hasN(l.kwh))add('kwh',l.kwh+' kWh');
  if(hasN(l.vll))add('vll','L-L '+l.vll+' V');
  if(hasN(l.vln))add('vln','L-N '+l.vln+' V');
  return o.length?'<div class="readings">'+o.join('')+'</div>':'';
}

function adivinar(){
  var h=location.hostname, partes=location.pathname.split('/').filter(Boolean);
  var owner=/\.github\.io$/i.test(h)?h.split('.')[0]:'';
  var repo=owner?(partes[0]||(owner+'.github.io')):'';
  var resto=owner&&partes[0]?partes.slice(1):partes;
  if(resto.length&&/\.html?$/i.test(resto[resto.length-1]))resto=resto.slice(0,-1);
  return {owner:owner,repo:repo,path:resto.concat([ARCHIVO_DATOS]).join('/'),branch:'main'};
}

/* ───── Render ───── */
function capturar(){
  var o={};
  document.querySelectorAll('#app input[id],#app select[id],#app textarea[id]').forEach(function(el){
    if(el.readOnly||/^p-/.test(el.id))return;
    o[el.id]=el.type==='checkbox'?{c:el.checked}:{v:el.value};
  });
  return o;
}
function restaurar(o){
  Object.keys(o).forEach(function(id){var el=$(id);if(!el)return;if('c' in o[id])el.checked=o[id].c;else el.value=o[id].v});
}
function render(){
  var app=$('app');
  if(!S){
    app.innerHTML='<div class="loading"><div>'+(notice?'<div class="msg err">'+ic('alert')+'<span>'+esc(notice.t)+'</span></div>':'<div class="logo">'+ic('bolt')+'</div>Cargando ficha del equipo…')+'</div></div>';
    return;
  }
  document.title=(S.equipo.nombre||'Ficha técnica')+' · Fichas Técnicas';
  var enPanel=!!(SES||guest);
  if(enPanel){
    var ok={dash:1,ficha:1,bitacora:1}; if(SES)ok.form=1; if(esAdmin()){ok.placa=1;ok.usuarios=1}
    if(!ok[view])view='dash';
    if(view==='placa'&&!placaTmp)placaTmp=S.placa.map(function(p){return p.slice()});
  }
  var key=[enPanel?1:0,SES?SES.u:'',view,editId||'',S.cfg?1:0].join('|');
  var guardado=(key===lastKey&&!limpiar)?capturar():null;
  limpiar=false; lastKey=key;

  var html;
  if(!enPanel){
    html='<div class="auth">'+authBrand()+'<main class="auth-main">'+(view==='config'?configHTML():loginHTML())+'</main></div>';
  }else{
    var body=view==='ficha'?fichaHTML():view==='bitacora'?bitacoraHTML():view==='form'?formHTML():view==='placa'?placaHTML():view==='usuarios'?usuariosHTML():dashHTML();
    html='<div class="app'+(menuOpen?' menu-open':'')+'">'+sideHTML()+'<div class="main">'+topHTML()+'<main class="content">'+noticeHTML()+body+'</main></div></div>';
  }
  app.innerHTML=html;
  if(guardado)restaurar(guardado);
  if(!enPanel&&view!=='config'&&$('lg-u')&&!busy&&!$('lg-u').value)$('lg-u').focus();
}

async function guardar(cambio,mensaje,okTxt,despues){
  busy=true;notice=null;render();
  try{
    S=await confirmar(S.cfg,SES.token,cambio,mensaje);
    if(despues)despues();
    notice={ok:true,t:okTxt}; limpiar=true;
  }catch(e){notice={ok:false,t:errorTexto(e)}}
  busy=false;render();window.scrollTo({top:0});
}
function num(id){var v=$(id).value.trim();return v===''?null:Number(v)}
function txt(id){return $(id).value.trim()}
function aviso(t){notice={ok:false,t:t};render();window.scrollTo({top:0})}
function ir(v){view=v;notice=null;pendingDelete=null;pendingUser=null;menuOpen=false;render();window.scrollTo({top:0})}

document.addEventListener('submit',async function(ev){
  ev.preventDefault(); if(busy)return;
  var id=ev.target.id;
  if(id==='login'){
    var u=txt('lg-u').toLowerCase(), pw=$('lg-pw').value;
    if(!u||!pw)return aviso('Escribe tu usuario y contraseña.');
    busy=true; notice=null; render();
    try{ SES=await entrar(u,pw); guest=false; view='dash'; limpiar=true; notice={ok:true,t:'Bienvenido, '+SES.nombre+'.'}; }
    catch(e){ notice={ok:false,t:'Usuario o contraseña incorrectos.'}; }
    busy=false; render(); return;
  }
  if(id==='cfgf'){
    var cfg={owner:txt('g-owner'),repo:txt('g-repo'),branch:txt('g-branch')||'main',path:txt('g-path').replace(/^\/+/,'')||ARCHIVO_DATOS,usuarios:[]};
    var tok=txt('g-token'), au=txt('a-u').toLowerCase(), an=txt('a-nombre'), p1=$('a-pw').value, p2=$('a-pw2').value;
    if(!cfg.owner||!cfg.repo||!tok)return aviso('Faltan la cuenta de GitHub, el repositorio o el token.');
    if(!usuarioValido(au))return aviso('El usuario debe tener de 3 a 20 letras minúsculas o números, sin espacios.');
    if(!an)return aviso('Falta el nombre del administrador.');
    if(p1!==p2)return aviso('Las contraseñas no coinciden.');
    if(!claveValida(p1))return aviso('La contraseña debe tener al menos 10 caracteres, con letras y números.');
    busy=true;notice=null;render();
    try{
      var kraw=crypto.getRandomValues(new Uint8Array(32));
      var t=await cifrarToken(kraw,tok); cfg.tiv=t.tiv; cfg.tct=t.tct;
      cfg.usuarios=[await envolverUsuario(kraw,au,an,'admin',p1)];
      S=await confirmar(cfg,tok,function(st){st.cfg=cfg},'Configura modo técnico (administrador '+au+')');
      SES={u:au,nombre:an,rol:'admin',token:tok,kraw:kraw}; guest=false; view='usuarios';
      history.replaceState(null,'',location.pathname+location.search);
      notice={ok:true,t:'Configuración guardada. Ahora da de alta a los técnicos.'};
    }catch(e){notice={ok:false,t:errorTexto(e)}}
    busy=false;render();return;
  }
  if(id==='ufrm'&&esAdmin()){
    var nu=txt('u-u').toLowerCase(), nn=txt('u-nombre'), rol=$('u-rol').value, q1=$('u-pw').value, q2=$('u-pw2').value;
    if(!usuarioValido(nu))return aviso('El usuario debe tener de 3 a 20 letras minúsculas o números, sin espacios.');
    var existe=(S.cfg.usuarios||[]).find(function(x){return x.u===nu});
    if(!nn&&existe)nn=existe.nombre;
    if(!nn)return aviso('Falta el nombre completo.');
    if(q1!==q2)return aviso('Las contraseñas no coinciden.');
    if(!claveValida(q1))return aviso('La contraseña debe tener al menos 10 caracteres, con letras y números.');
    busy=true;render();
    var nuevo=await envolverUsuario(SES.kraw,nu,nn,rol,q1);
    busy=false;
    await guardar(function(st){
      var l=st.cfg.usuarios, i=l.findIndex(function(x){return x.u===nu});
      if(i>=0)l[i]=nuevo; else l.push(nuevo);
    },(existe?'Cambia contraseña de ':'Agrega usuario ')+nu,(existe?'Contraseña actualizada para ':'Usuario creado: ')+nu+'.');
    return;
  }
  if(id==='tfrm'&&esAdmin()){
    var nt=txt('t-token'); if(!nt)return aviso('Pega el token nuevo.');
    busy=true;render();
    var tc=await cifrarToken(SES.kraw,nt); busy=false;
    var viejo=SES.token; SES.token=nt;
    await guardar(function(st){st.cfg.tiv=tc.tiv;st.cfg.tct=tc.tct},'Renueva token de GitHub','Token renovado.');
    if(notice&&!notice.ok)SES.token=viejo;
    return;
  }
  if(id==='frm'){
    if(!txt('f-fecha'))return aviso('Falta la fecha.');
    var acts=CHECKS.filter(function(c,i){return $('c-'+i).checked});
    txt('f-otras').split('\n').map(function(s){return s.trim()}).filter(Boolean).forEach(function(s){acts.push(s)});
    if(!acts.length&&!txt('f-obs'))return aviso('Marca al menos una actividad o escribe qué se le hizo a la máquina.');
    var prev=editId?S.historial.find(function(x){return x.id===editId}):null;
    var reg={id:editId||('r'+Date.now().toString(36)),fecha:txt('f-fecha'),tipo:$('f-tipo').value,
      tecnico:prev?prev.tecnico:SES.nombre, usuario:prev?(prev.usuario||''):SES.u,
      horometro:num('f-horo'),actividades:acts,
      lectura:{comb:num('l-comb'),aceite:num('l-aceite'),temp:num('l-temp'),bat:num('l-bat'),rpm:num('l-rpm'),hz:num('l-hz'),kwh:num('l-kwh'),vll:txt('l-vll'),vln:txt('l-vln')},
      refacciones:txt('f-ref'),obs:txt('f-obs')};
    await guardar(function(st){
      var i=st.historial.findIndex(function(x){return x.id===reg.id});
      if(i>=0)st.historial[i]=reg; else st.historial.push(reg);
    },(prev?'Edita':'Agrega')+' registro '+reg.fecha+' · '+reg.tipo+' · '+SES.u,(prev?'Cambios guardados.':'Registro guardado.')+' Quien escanee el QR lo verá en 1 a 2 minutos.',function(){editId=null;view='bitacora'});
  }
});

document.addEventListener('click',async function(ev){
  var b=ev.target.closest('[data-act]');if(!b||busy)return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==='nav'){var v=b.dataset.v; if(v==='placa')placaTmp=S.placa.map(function(p){return p.slice()}); if(v==='form'&&view!=='form')editId=null; ir(v);}
  else if(a==='menu'){menuOpen=!menuOpen;render();}
  else if(a==='menu-close'){menuOpen=false;render();}
  else if(a==='pw'){var i=$(b.dataset.for);if(i)i.type=i.type==='password'?'text':'password';}
  else if(a==='filtro'){filtro=b.dataset.f;render();}
  else if(a==='guest'){guest=true;view='dash';notice=null;render();}
  else if(a==='login'){guest=false;view='login';notice=null;menuOpen=false;history.replaceState(null,'',location.pathname+location.search);render();}
  else if(a==='config'){view='config';notice=null;render();}
  else if(a==='auth-back'){view='login';notice=null;history.replaceState(null,'',location.pathname+location.search);render();}
  else if(a==='logout'){SES=null;guest=false;view='login';editId=null;notice=null;menuOpen=false;history.replaceState(null,'',location.pathname+location.search);render();}
  else if(a==='cancel-edit'){editId=null;ir('bitacora');}
  else if(a==='edit'){editId=id;ir('form');}
  else if(a==='del'){pendingDelete=id;render();}
  else if(a==='del-no'){pendingDelete=null;render();}
  else if(a==='del-ok'){pendingDelete=null;await guardar(function(st){st.historial=st.historial.filter(function(x){return x.id!==id})},'Elimina registro '+id+' · '+SES.u,'Registro eliminado.');}
  else if(a==='u-del'){pendingUser=b.dataset.u;render();}
  else if(a==='u-del-no'){pendingUser=null;render();}
  else if(a==='u-del-ok'){var uu=b.dataset.u;pendingUser=null;await guardar(function(st){st.cfg.usuarios=st.cfg.usuarios.filter(function(x){return x.u!==uu})},'Quita usuario '+uu,'Usuario quitado: '+uu+'.');}
  else if(a==='p-add'){syncP();placaTmp.push(['','']);render();}
  else if(a==='p-del'){syncP();placaTmp.splice(+b.dataset.i,1);render();}
  else if(a==='p-save'){syncP();var nueva=placaTmp.filter(function(p){return p[0]||p[1]});await guardar(function(st){st.placa=nueva},'Actualiza datos de placa','Datos de placa guardados.',function(){view='ficha'});}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&menuOpen){menuOpen=false;render();}});
function syncP(){placaTmp.forEach(function(p,i){var k=$('p-k-'+i),v=$('p-v-'+i);if(k&&v){p[0]=k.value.trim();p[1]=v.value.trim();}})}

function porHash(){
  if(!SES){
    if(location.hash==='#consulta'){guest=true;view='dash'}
    else if(location.hash==='#configurar'){guest=false;view='config'}
    else if(location.hash==='#tecnico'){guest=false;view='login'}
  }
  render();
}
window.addEventListener('hashchange',porHash);
render();
fetch(ARCHIVO_DATOS+'?v='+Date.now(),{cache:'no-store'})
  .then(function(r){if(!r.ok)throw new Error(r.status);return r.text()})
  .then(function(t){S=leerTxt(t);porHash()})
  .catch(function(){notice={ok:false,t:'No se encontró el archivo '+ARCHIVO_DATOS+'. Súbelo a la misma carpeta que index.html.'};render()});
})();
</script>
