<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0a0a">
<title>Fichas Técnicas de Mantenimiento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#f4f4f5; --card:#ffffff; --ink:#0a0a0a; --ink-2:#27272a; --muted:#71717a; --line:#e4e4e7; --soft:#fafafa; --soft-2:#f4f4f5;
  --ok:#15803d; --ok-s:#dcfce7; --warn:#b45309; --warn-s:#fef3c7; --bad:#b91c1c; --bad-s:#fee2e2; --info:#1d4ed8; --info-s:#dbeafe;
  --sh:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.05);
  --sh-h:0 14px 30px -10px rgba(0,0,0,.22),0 4px 10px -4px rgba(0,0,0,.08);
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
.ic{width:18px;height:18px;flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* ───── Animaciones ───── */
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes shimmer{from{background-position:-200% 0}to{background-position:200% 0}}
@keyframes slide{from{left:-40%}to{left:100%}}
@keyframes toastIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.9);opacity:0}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes pulse{50%{transform:scale(.9);opacity:.6}}
@keyframes spin{to{transform:rotate(360deg)}}
.enter>*{animation:up .5s var(--ease) both}
.enter>*:nth-child(2){animation-delay:.05s}.enter>*:nth-child(3){animation-delay:.1s}.enter>*:nth-child(4){animation-delay:.15s}
.enter>*:nth-child(5){animation-delay:.2s}.enter>*:nth-child(6){animation-delay:.25s}.enter>*:nth-child(n+7){animation-delay:.3s}
.play>*{animation:up .45s var(--ease) both;animation-delay:calc(var(--i,0) * 30ms)}
.sk{display:inline-block;border-radius:8px;background:linear-gradient(90deg,#ececee 25%,#f6f6f7 50%,#ececee 75%);background-size:200% 100%;animation:shimmer 1.3s linear infinite}
.busybar{position:fixed;top:0;left:0;right:0;height:3px;overflow:hidden;z-index:200;background:rgba(0,0,0,.06)}
.busybar i{position:absolute;top:0;height:100%;width:40%;background:var(--ink);border-radius:3px;animation:slide 1s ease-in-out infinite}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite}
.btn.light .spin{border-color:rgba(0,0,0,.15);border-top-color:var(--ink)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ───── Botones ───── */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;font:600 14px/1 var(--body);border-radius:10px;padding:11px 18px;border:1px solid var(--ink);background:var(--ink);color:#fff;white-space:nowrap;text-decoration:none;
  transition:transform .18s var(--ease),box-shadow .18s var(--ease),background .18s,color .18s,border-color .18s}
.btn:hover{background:var(--ink-2);transform:translateY(-1px);box-shadow:0 8px 18px -8px rgba(0,0,0,.45)}
.btn:active{transform:translateY(0) scale(.97);box-shadow:none}
.btn .ic{width:16px;height:16px;transition:transform .2s var(--ease)}
.btn:hover .ic.mv{transform:translateX(3px)}
.btn.light{background:var(--card);color:var(--ink);border-color:var(--line)}
.btn.light:hover{background:var(--soft-2);border-color:#d4d4d8;box-shadow:0 6px 14px -8px rgba(0,0,0,.2)}
.btn.danger{background:var(--card);color:var(--bad);border-color:#fecaca}
.btn.danger:hover{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:9px}
.btn.block{width:100%}
.btn.lg{height:48px;font-size:15px}
.btn:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav-i:focus-visible,.tab:focus-visible,.eqc:focus-visible,.li:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.link{background:none;border:0;padding:4px 2px;color:var(--ink);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px;text-decoration:none;border-radius:6px}
.link .ic{width:15px;height:15px;transition:transform .2s var(--ease)}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.link:hover .ic{transform:translateX(3px)}

/* ───── Acceso ───── */
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);animation:fade .4s ease both}
.auth-brand{position:relative;overflow:hidden;background:#0a0a0a;color:#fff;padding:44px 52px;display:flex;flex-direction:column;justify-content:space-between;gap:40px}
.auth-brand::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.09) 1px,transparent 1px);background-size:22px 22px;mask-image:linear-gradient(160deg,#000 20%,transparent 75%);-webkit-mask-image:linear-gradient(160deg,#000 20%,transparent 75%)}
.auth-brand>*{position:relative}
.auth-pitch{display:grid;gap:18px;max-width:520px;animation:up .7s var(--ease) .1s both}
.auth-pitch h1{font-size:clamp(30px,3.4vw,44px);line-height:1.08;margin:0;letter-spacing:-.03em;font-weight:800}
.auth-pitch p{margin:0;color:#a1a1aa;font-size:15px;max-width:440px}
.stat-row{display:flex;flex-wrap:wrap;gap:28px;margin-top:6px}
.stat-row div{display:grid}
.stat-row b{font:700 28px/1.1 var(--mono)}
.stat-row span{color:#a1a1aa;font-size:12px}
.feats{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.feats li{display:flex;align-items:center;gap:12px;color:#e4e4e7}
.feats .ic{width:34px;height:34px;padding:8px;border-radius:10px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.1)}
.auth-foot{color:#71717a;font-size:12px}
.auth-main{display:grid;place-items:center;padding:40px 24px;background:var(--card)}
.auth-card{width:100%;max-width:400px;display:grid;gap:18px;animation:up .6s var(--ease) .15s both}
.auth-card.wide{max-width:600px}
.auth-head h2{margin:0 0 6px;font-size:26px;letter-spacing:-.02em;font-weight:800}
.auth-head p{margin:0;color:var(--muted)}
.sep{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}
.sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--line)}
.auth-note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.loading{min-height:100vh;display:grid;place-items:center;text-align:center;color:var(--muted);gap:10px}
.loading .logo{margin:0 auto 14px;width:54px;height:54px;animation:pulse 1.3s ease-in-out infinite}

/* ───── Marca ───── */
.brand{display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:12px;background:#fff;color:#0a0a0a;display:grid;place-items:center;flex:none}
.logo .ic{width:22px;height:22px}
.loading .logo{background:var(--ink);color:#fff}
.brand b{display:block;color:#fff;font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:#a1a1aa;font-size:12px}
.eyebrow{font:600 11px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;color:#a1a1aa}

/* ───── Estructura ───── */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.app.first{animation:fade .35s ease both}
.side{position:sticky;top:0;height:100vh;background:#0a0a0a;color:#d4d4d8;display:flex;flex-direction:column;gap:4px;padding:20px 14px;overflow-y:auto;z-index:40}
.side .brand{padding:2px 8px 18px;margin-bottom:4px;border-bottom:1px solid rgba(255,255,255,.08)}
.nav{display:grid;gap:3px}
.nav-h{font:600 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:#71717a;padding:16px 12px 8px}
.nav-i{position:relative;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;border-radius:10px;background:none;color:#d4d4d8;font:500 14px/1.2 var(--body);text-align:left;transition:background .18s,color .18s,transform .18s var(--ease)}
.nav-i:hover{background:#1c1c1f;color:#fff;transform:translateX(2px)}
.nav-i[aria-current="page"]{background:#fff;color:#0a0a0a;font-weight:600}
.nav-i .cnt{margin-left:auto;font:600 11px/1 var(--mono);padding:4px 7px;border-radius:99px;background:rgba(255,255,255,.1);color:#e4e4e7}
.nav-i[aria-current="page"] .cnt{background:#0a0a0a;color:#fff}
.nav-eq{display:grid;gap:2px;line-height:1.25;min-width:0}
.nav-eq small{font:600 11px var(--mono);opacity:.7}
.nav-eq span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side-foot{margin-top:auto;padding-top:14px;border-top:1px solid rgba(255,255,255,.08);display:grid;gap:12px}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px;min-width:0}
.me b{display:block;color:#fff;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:#a1a1aa;font-size:12px}
.avatar{width:36px;height:36px;border-radius:50%;background:#fff;color:#0a0a0a;display:grid;place-items:center;font:700 13px/1 var(--body);flex:none}
.avatar .ic{width:17px;height:17px}
.side .btn{background:#18181b;border-color:#27272a;color:#e4e4e7}
.side .btn:hover{background:#27272a;color:#fff}
.side .btn.white{background:#fff;color:#0a0a0a;border-color:#fff}
.side .btn.white:hover{background:#e4e4e7}
.scrim{display:none}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;min-height:70px;padding:12px 32px;background:rgba(255,255,255,.85);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--line)}
.top h1{margin:0;font-size:19px;letter-spacing:-.02em;line-height:1.2;font-weight:700}
.crumb{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
.crumb .ic{width:13px;height:13px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:10px}
.burger{display:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px;transition:background .15s}
.burger:hover{background:var(--soft-2)}
.content{padding:28px 32px 64px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;width:100%;max-width:1320px}
.badge{display:inline-flex;align-items:center;gap:6px;font:600 12px/1 var(--body);padding:7px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--muted)}
.badge .ic{width:14px;height:14px}
.badge.dark{background:var(--ink);color:#fff;border-color:var(--ink)}
.badge.ok{background:var(--ok-s);color:var(--ok);border-color:transparent}

/* ───── Tarjetas ───── */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);min-width:0;transition:box-shadow .2s var(--ease),transform .2s var(--ease),border-color .2s}
.card.hov:hover{box-shadow:var(--sh-h);transform:translateY(-2px)}
.card-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.card-h h3{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.card-h h3 .ic{width:18px;height:18px}
.card-h .sub{font-size:12px;color:var(--muted);font-weight:500}
.card-b{padding:20px;display:grid;gap:16px}
.cols{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.stack{display:grid;gap:22px;min-width:0}

.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.hello h2{margin:0;font-size:26px;letter-spacing:-.03em;font-weight:800}
.hello p{margin:2px 0 0;color:var(--muted)}
.hello p::first-letter{text-transform:uppercase}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{padding:18px 20px;display:grid;gap:4px;align-content:start}
.kpi-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:500;margin-bottom:8px}
.kpi-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--ink);color:#fff;transition:transform .3s var(--ease)}
.kpi:hover .kpi-ic{transform:rotate(-8deg) scale(1.08)}
.kpi .v{font:700 30px/1.1 var(--mono);letter-spacing:-.02em}
.kpi .s{font-size:12px;color:var(--muted)}

/* ───── Equipos ───── */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.search{position:relative;flex:1 1 320px;max-width:520px}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:42px;padding-right:44px;height:46px;border-radius:12px;background:var(--card)}
.search kbd{position:absolute;right:12px;top:50%;transform:translateY(-50%);font:600 11px/1 var(--mono);padding:5px 7px;border-radius:6px;border:1px solid var(--line);background:var(--soft);color:var(--muted)}
.toolbar select{width:auto;min-width:200px;height:46px;border-radius:12px;background:var(--card)}
.count{font-size:13px;color:var(--muted);margin-left:auto}
.eq-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.eqc{position:relative;display:grid;gap:10px;align-content:start;padding:18px;border-radius:16px;background:var(--card);border:1px solid var(--line);text-decoration:none;color:var(--ink);box-shadow:var(--sh);min-width:0;
  transition:transform .22s var(--ease),box-shadow .22s var(--ease),border-color .22s}
.eqc:hover{transform:translateY(-4px);box-shadow:var(--sh-h);border-color:var(--ink)}
.eqc-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.eqc-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--soft-2);color:var(--ink);transition:background .22s,color .22s,transform .3s var(--ease)}
.eqc-ic .ic{width:21px;height:21px}
.eqc:hover .eqc-ic{background:var(--ink);color:#fff;transform:rotate(-6deg)}
.idb{font:600 11px/1 var(--mono);padding:6px 8px;border-radius:7px;background:var(--ink);color:#fff;letter-spacing:.02em}
.eqc b{font-size:15px;line-height:1.3;letter-spacing:-.01em;overflow-wrap:anywhere}
.eqc .meta{font-size:12px;color:var(--muted);line-height:1.4}
.eqc-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding-top:12px;margin-top:2px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.eqc-foot .ic{width:16px;height:16px;color:var(--ink);transition:transform .22s var(--ease)}
.eqc:hover .eqc-foot .ic{transform:translateX(4px)}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.st i{width:8px;height:8px;border-radius:50%;background:#d4d4d8;flex:none}
.st.ok{color:var(--ok)} .st.ok i{background:var(--ok);box-shadow:0 0 0 3px var(--ok-s)}
.st.w{color:var(--warn)} .st.w i{background:var(--warn);box-shadow:0 0 0 3px var(--warn-s)}
.st.none{color:var(--muted)}

.list{display:grid}
.li{display:flex;align-items:center;gap:14px;padding:13px 20px;border-top:1px solid var(--line);min-width:0;text-decoration:none;color:inherit;transition:background .15s}
.li:first-child{border-top:0}
a.li:hover{background:var(--soft)}
a.li:hover .li-go{opacity:1;transform:none}
.li-date{width:48px;flex:none;text-align:center;border-radius:10px;background:var(--soft-2);padding:7px 0;line-height:1.1}
.li-date b{display:block;font:700 16px var(--mono)}
.li-date span{font-size:10px;color:var(--muted);text-transform:uppercase;font-weight:600;letter-spacing:.05em}
.li-body{min-width:0;flex:1}
.li-body b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-body span{font-size:12px;color:var(--muted);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-go{opacity:0;transform:translateX(-4px);transition:.2s var(--ease)}
.bars{display:grid;gap:12px}
.bar-r{display:grid;gap:6px}
.bar-r div:first-child{display:flex;justify-content:space-between;font-size:13px}
.bar-r b{font-family:var(--mono)}
.bar{height:8px;border-radius:99px;background:var(--soft-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:inherit;transform-origin:left;animation:grow .9s var(--ease) both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}

/* ───── Equipo ───── */
.hero{position:relative;overflow:hidden;border-radius:20px;padding:26px 28px;color:#fff;background:#0a0a0a;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end;justify-content:space-between}
.hero::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:20px 20px;mask-image:linear-gradient(110deg,transparent 35%,#000);-webkit-mask-image:linear-gradient(110deg,transparent 35%,#000)}
.hero>*{position:relative}
.hero-ic{width:56px;height:56px;border-radius:16px;background:#fff;color:#0a0a0a;display:grid;place-items:center;margin-bottom:14px}
.hero-ic .ic{width:28px;height:28px}
.hero h2{margin:6px 0 14px;font-size:clamp(22px,2.6vw,32px);line-height:1.12;letter-spacing:-.03em;font-weight:800}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font:600 12px/1 var(--mono);padding:7px 10px;border-radius:8px;background:rgba(255,255,255,.1);color:#e4e4e7;border:1px solid rgba(255,255,255,.12)}
.tag.id{background:#fff;color:#0a0a0a;border-color:#fff}
.hero .btn.light{background:transparent;color:#fff;border-color:rgba(255,255,255,.25)}
.hero .btn.light:hover{background:#fff;color:#0a0a0a}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:5px;border-radius:14px;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);width:max-content;max-width:100%}
.tab{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:9px 14px;border-radius:10px;font:600 13px/1 var(--body);color:var(--muted);transition:background .18s,color .18s}
.tab .ic{width:16px;height:16px}
.tab:hover{color:var(--ink);background:var(--soft-2)}
.tab[aria-pressed="true"]{background:var(--ink);color:#fff}
.tab .cnt{font:600 11px/1 var(--mono);padding:3px 6px;border-radius:99px;background:var(--soft-2);color:var(--ink)}
.tab[aria-pressed="true"] .cnt{background:rgba(255,255,255,.18);color:#fff}
dl.specs{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));column-gap:32px}
dl.specs div{display:flex;justify-content:space-between;gap:16px;padding:12px 4px;border-bottom:1px dashed var(--line);min-width:0;transition:background .15s}
dl.specs div:hover{background:var(--soft)}
dl.specs dt{color:var(--muted);font-size:13px}
dl.specs dd{margin:0;font:600 13px/1.4 var(--mono);text-align:right;overflow-wrap:anywhere}
dl.specs dd.pc{color:#a1a1aa;font-weight:500;font-style:italic;font-family:var(--body)}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.chk li{display:flex;gap:10px;align-items:flex-start;font-size:13px}
.chk .ic{width:16px;height:16px;margin-top:2px;color:var(--muted)}
.grupo{font:700 11px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.filters{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.log{display:grid;gap:14px}
.entry{padding:18px 20px;display:grid;gap:12px}
.entry-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.entry-date{display:flex;align-items:center;gap:8px;font:600 14px/1 var(--mono)}
.entry-date .ic{color:var(--muted);width:16px;height:16px}
.who{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
.who .ic{width:14px;height:14px}
.entry-tools{margin-left:auto;display:flex;gap:6px}
.pill{font:700 10px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:6px 9px;border-radius:99px;white-space:nowrap}
.pill.prev{background:var(--ok-s);color:var(--ok)} .pill.corr{background:var(--bad-s);color:var(--bad)}
.pill.lect{background:var(--info-s);color:var(--info)} .pill.prue{background:var(--warn-s);color:var(--warn)}
.acts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:6px 18px}
.acts li{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.acts .ic{width:16px;height:16px;color:var(--ok);margin-top:2px}
.readings{display:flex;flex-wrap:wrap;gap:6px}
.rd{font:500 12px/1 var(--mono);padding:7px 9px;border-radius:8px;background:var(--soft-2);border:1px solid var(--line)}
.obs{font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere;padding:10px 12px;border-radius:10px;background:var(--soft);border-left:3px solid var(--ink)}
.meta{font-size:13px;color:var(--muted)}
.empty{display:grid;place-items:center;gap:8px;padding:44px 20px;text-align:center;color:var(--muted);border:1px dashed #d4d4d8;border-radius:16px;background:var(--card)}
.empty .ic{width:30px;height:30px;color:#a1a1aa}
.qrs{display:flex;flex-wrap:wrap;gap:20px}
.qrs figure{margin:0;display:grid;gap:12px;justify-items:center;flex:1 1 240px;padding:16px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.qrs canvas{width:100%;max-width:260px;height:auto;border-radius:8px;background:#fff;box-shadow:var(--sh)}

/* ───── Formularios ───── */
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.f{display:grid;gap:6px;min-width:0}
.f>label{font:600 12px/1.2 var(--body);color:var(--ink-2)}
input,select,textarea{font:500 14px/1.3 var(--body);color:var(--ink);background:var(--card);border:1px solid #d4d4d8;border-radius:10px;padding:10px 12px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s,background .15s}
input:hover,select:hover,textarea:hover{border-color:#a1a1aa}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px rgba(10,10,10,.08)}
input[readonly]{background:var(--soft-2);color:var(--muted)}
input.mono{font-family:var(--mono)}
textarea{min-height:88px;resize:vertical}
.inp{position:relative;display:block}
.inp>.ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted);width:17px;height:17px;pointer-events:none;transition:color .15s}
.inp:focus-within>.ic{color:var(--ink)}
.inp input{padding-left:42px;height:48px}
.inp .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;padding:8px;color:var(--muted);border-radius:8px;transition:background .15s,color .15s}
.inp .eye:hover{background:var(--soft-2);color:var(--ink)}
.inp .eye .ic{width:17px;height:17px}
.sec-t{font:700 13px/1.2 var(--body);display:flex;align-items:center;gap:10px;padding-top:6px}
.sec-t .ic{width:16px;height:16px}
.sec-t::after{content:"";flex:1;height:1px;background:var(--line)}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.checks label{display:flex;gap:10px;align-items:flex-start;font-size:13px;padding:11px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:border-color .15s,background .15s,transform .15s var(--ease)}
.checks label:hover{border-color:#a1a1aa;transform:translateY(-1px)}
.checks label:has(input:checked){border-color:var(--ink);background:var(--soft-2)}
.checks input{width:17px;height:17px;margin:0;accent-color:#0a0a0a;flex:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.help{font-size:12px;color:var(--muted);margin:0}
.msg{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;font-size:13px;font-weight:500;animation:pop .35s var(--ease) both}
.msg .ic{width:18px;height:18px;margin-top:1px}
.msg.ok{background:var(--ok-s);color:var(--ok)} .msg.err{background:var(--bad-s);color:var(--bad)} .msg.info{background:var(--soft-2);color:var(--ink)}
.spec-edit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;gap:8px;align-items:center;animation:up .3s var(--ease) both}
.urow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:14px 20px;border-top:1px solid var(--line);transition:background .15s}
.urow:first-child{border-top:0}
.urow:hover{background:var(--soft)}
.urow .avatar{background:var(--ink);color:#fff}
.urow-b{flex:1;min-width:0}
.urow-b b{display:block}
.urow-b span{font-size:12px;color:var(--muted)}

/* ───── Avisos ───── */
.toasts{position:fixed;right:24px;bottom:24px;z-index:150;display:grid;gap:10px;max-width:min(420px,calc(100vw - 32px))}
.toast{display:flex;gap:12px;align-items:flex-start;padding:14px 14px 14px 16px;border-radius:14px;background:#0a0a0a;color:#fff;box-shadow:0 20px 40px -12px rgba(0,0,0,.45);animation:toastIn .4s var(--ease) both;font-size:13px;font-weight:500;transition:opacity .3s,transform .3s}
.toast.out{opacity:0;transform:translateY(10px)}
.toast .ic{width:19px;height:19px;margin-top:1px}
.toast.ok .ic.st-i{color:#4ade80} .toast.err .ic.st-i{color:#f87171}
.toast span{flex:1}
.toast button{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:8px;padding:4px;display:grid;place-items:center;transition:background .15s}
.toast button:hover{background:rgba(255,255,255,.2)}
.toast button .ic{width:15px;height:15px;margin:0}

/* ───── Responsivo ───── */
@media (max-width:1200px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:1100px){.cols,.cols.even{grid-template-columns:minmax(0,1fr)}}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:280px;transform:translateX(-100%);transition:transform .28s var(--ease)}
  .menu-open .side{transform:none;box-shadow:0 0 50px rgba(0,0,0,.4)}
  .menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:35;animation:fade .2s ease both}
  .burger{display:inline-flex}
  .top{padding:10px 16px;min-height:62px}
  .top h1{font-size:17px}
  .content{padding:18px 16px 56px;gap:18px}
  .auth{grid-template-columns:minmax(0,1fr)}
  .auth-brand{padding:28px 24px 32px;gap:22px}
  .feats,.auth-foot{display:none}
  dl.specs{grid-template-columns:minmax(0,1fr)}
  .kpi{padding:14px}.kpi .v{font-size:24px}
  .count{margin-left:0;width:100%}
  .toolbar select{flex:1}
}
@media (max-width:560px){
  .top-r .btn span,.top-r .badge span{display:none}
  .top-r .btn{padding:10px}
  .hero{padding:22px 20px}
  .spec-edit{grid-template-columns:1fr}
  .entry-tools{margin-left:0;width:100%}
  .tabs{width:100%}
  .tab{flex:1;justify-content:center;padding:9px 8px}
  .eq-grid{grid-template-columns:minmax(0,1fr)}
  .toasts{right:16px;bottom:16px}
  .li .pill{display:none}
  .li{padding:12px 16px}
}
</style>

function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hasN(v){return v!==null&&v!==undefined&&String(v)!==''}

function ordenado(){return EQ.historial.slice().sort(function(a,b){return a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0})}

/* ═════════ Formato de texto (Bloc de notas) ═════════ */
function tEsc(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n')}
function tUnesc(v){return v.replace(/\\(n|\\)/g,function(m,c){return c==='n'?'\n':'\\'})}
function tNum(v){return /^-?\d+(\.\d+)?$/.test(v)?Number(v):v}
function lineas(txt,cb){
  var sec=null,arg='';
  String(txt||'').replace(/^﻿/,'').split(/\r?\n/).forEach(function(raw){
    var l=raw.trim(); if(!l||l.charAt(0)==='#')return;
    var m=l.match(/^\[([A-ZÁÉÍÓÚa-z]+)\s*(.*)\]$/); if(m){sec=m[1].toUpperCase();arg=m[2].trim();cb(sec,arg,null,null,true);return}
    var i=l.indexOf('='); if(i<0)return;
    cb(sec,arg,l.slice(0,i).trim(),tUnesc(l.slice(i+1).trim()),false);
  });
}
/* config.txt (o la sección [CONFIG] de datos.txt) */
function leerConfig(txt){
  var c={},us=[],cur=null;
  lineas(txt,function(sec,arg,k,v,head){
    if(head){if(sec==='USUARIO'){cur={u:arg.toLowerCase(),nombre:'',rol:'tecnico',it:IT};us.push(cur)}return}
    if(sec==='CONFIG')c[k]=v;
    else if(sec==='USUARIO'){if(k==='nombre')cur.nombre=v;else if(k==='rol')cur.rol=v;else if(k==='sal')cur.s=v;else if(k==='iv')cur.iv=v;else if(k==='llave_cifrada')cur.ct=v;else if(k==='iteraciones')cur.it=Number(v)||IT}
  });
  if(!c.token_cifrado)return null;
  return {owner:c.cuenta_github,repo:c.repositorio,branch:c.rama||'main',tiv:c.token_iv,tct:c.token_cifrado,usuarios:us};
}
function escribirConfig(c){
  var L=['# ==========================================================','# CONFIGURACIÓN DEL MODO TÉCNICO · Fichas técnicas de mantenimiento','# Todo va cifrado. No modifiques este archivo a mano.','# ==========================================================',''];
  function kv(k,v){L.push(k+' = '+tEsc(v))}
  L.push('[CONFIG]');kv('cuenta_github',c.owner);kv('repositorio',c.repo);kv('rama',c.branch);kv('token_iv',c.tiv);kv('token_cifrado',c.tct);L.push('');
  c.usuarios.forEach(function(u){L.push('[USUARIO '+u.u+']');kv('nombre',u.nombre);kv('rol',u.rol);kv('sal',u.s);kv('iv',u.iv);kv('llave_cifrada',u.ct);kv('iteraciones',u.it);L.push('')});
  return L.join('\r\n');
}

  return out;
}
function escribirCatalogo(cat){
  var L=['# ==========================================================','# CATÁLOGO DE EQUIPOS ('+cat.length+')','# Formato:  ID = Nombre | Ubicación | Tipo','# Cada equipo tiene su archivo en la carpeta equipos/','# ==========================================================',''];
  cat.slice().sort(function(a,b){return a.id<b.id?-1:1}).forEach(function(e){L.push(e.id+' = '+[e.nombre,e.ubicacion,e.tipo].map(function(x){return tEsc(x).replace(/\|/g,'/')}).join(' | '))});
  return L.join('\r\n')+'\r\n';
}
/* equipos/<ID>.txt */
function leerEquipo(txt){
  var st={equipo:{},placa:[],checklist:[],lecturas:[],historial:[]},cur=null;
  lineas(txt,function(sec,arg,k,v,head){
    if(head){if(sec==='REGISTRO'){cur={id:'',fecha:'',tipo:'',tecnico:'',usuario:'',horometro:null,actividades:[],lectura:{},refacciones:'',obs:''};st.historial.push(cur)}return}
    if(sec==='EQUIPO')st.equipo[k]=v;
    else if(sec==='PLACA')st.placa.push([k,v]);
    else if(sec==='CHECKLIST')st.checklist.push(v);
    else if(sec==='LECTURAS'){var p=v.split('|');st.lecturas.push([k,(p[0]||k).trim(),(p[1]||'').trim()])}
    else if(sec==='REGISTRO'){
      if(k==='id'||k==='fecha'||k==='tipo'||k==='tecnico'||k==='usuario'||k==='refacciones')cur[k]=v;
      else if(k==='actividad')cur.actividades.push(v);
      else if(k==='horometro')cur.horometro=v===''?null:tNum(v);
      else if(k==='observaciones')cur.obs=v;
      else cur.lectura[k]=tNum(v);
    }
  });
  var pl=plantilla(st.equipo.id);
  if(!st.checklist.length)st.checklist=pl.checklist.slice();
  if(!st.lecturas.length)st.lecturas=pl.lecturas.map(function(x){return x.slice()});
  st.historial.forEach(function(r,i){if(!r.id)r.id='r'+(i+1)});
  return st;
}
function escribirEquipo(st){
  var L=[],q=st.equipo,h=st.historial.slice().sort(function(a,b){return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0});
  function kv(k,v){L.push(k+' = '+tEsc(v))}
  L.push('# ==========================================================','# FICHA TÉCNICA Y BITÁCORA DE MANTENIMIENTO','# Equipo: '+tEsc(q.id)+' · '+tEsc(q.nombre),'# Actualizado: '+new Date().toLocaleString('es-MX'),'# Formato  campo = valor . Las líneas con # son comentarios.','# ==========================================================','');
  L.push('[EQUIPO]');['id','nombre','tipo','ubicacion','area'].concat(Object.keys(q).filter(function(k){return ['id','nombre','tipo','ubicacion','area'].indexOf(k)<0})).forEach(function(k){if(q[k]!==undefined)kv(k,q[k])});L.push('');
  L.push('[PLACA]');st.placa.forEach(function(p){kv(String(p[0]).replace(/=/g,'-'),p[1])});L.push('');
  L.push('[CHECKLIST]');st.checklist.forEach(function(c){kv('actividad',c)});L.push('');
  L.push('[LECTURAS]');st.lecturas.forEach(function(x){kv(x[0],x[1]+' | '+x[2])});L.push('');
  L.push('# ---------------- ÍNDICE DE REGISTROS ('+h.length+') ----------------','# No.  | Fecha      | Tipo                       | Técnico');
  h.forEach(function(r,i){L.push('# '+String(i+1).padStart(4,'0')+' | '+r.fecha+' | '+(r.tipo+'                          ').slice(0,26)+' | '+tEsc(r.tecnico))});
  L.push('');
  h.forEach(function(r,i){
    L.push('[REGISTRO '+String(i+1).padStart(4,'0')+']');
    kv('id',r.id);kv('fecha',r.fecha);kv('tipo',r.tipo);kv('tecnico',r.tecnico);if(r.usuario)kv('usuario',r.usuario);
    kv('horometro',hasN(r.horometro)?r.horometro:'');
    (r.actividades||[]).forEach(function(a){kv('actividad',a)});
    Object.keys(r.lectura||{}).forEach(function(k){if(hasN(r.lectura[k]))kv(k,r.lectura[k])});
    if(r.refacciones)kv('refacciones',r.refacciones);
    if(r.obs)kv('observaciones',r.obs);
    L.push('');
  });
  return L.join('\r\n');
}

/* ═════════ Cifrado: token cifrado con llave maestra; cada usuario guarda la llave cifrada con su contraseña ═════════ */
function b64e(u8){var s='';for(var i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)}
function b64d(s){var b=atob(String(s).replace(/\s/g,'')),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function llavePw(pw,salt,it){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function llaveMaestra(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
async function aesCifrar(key,bytes){var iv=crypto.getRandomValues(new Uint8Array(12));var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,bytes));return {iv:b64e(iv),ct:b64e(ct)}}
async function aesDescifrar(key,iv,ct){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(iv)},key,b64d(ct)))}
async function envolverUsuario(kraw,u,nombre,rol,pw){var salt=crypto.getRandomValues(new Uint8Array(16)),k=await llavePw(pw,salt,IT),e=await aesCifrar(k,kraw);return {u:u,nombre:nombre,rol:rol,s:b64e(salt),iv:e.iv,ct:e.ct,it:IT}}
async function cifrarToken(kraw,token){var e=await aesCifrar(await llaveMaestra(kraw),new TextEncoder().encode(token));return {tiv:e.iv,tct:e.ct}}
async function entrar(u,pw){
  var us=CFG.usuarios.find(function(x){return x.u===u}); if(!us)throw new Error('x');
  var kraw=await aesDescifrar(await llavePw(pw,b64d(us.s),us.it),us.iv,us.ct);
  var token=new TextDecoder().decode(await aesDescifrar(await llaveMaestra(kraw),CFG.tiv,CFG.tct));
  return {u:us.u,nombre:us.nombre,rol:us.rol,token:token,kraw:kraw};
}
function guardarSesion(){try{if(SES)sessionStorage.setItem('mto_ses',JSON.stringify({u:SES.u,nombre:SES.nombre,rol:SES.rol,token:SES.token,kraw:b64e(SES.kraw)}));else sessionStorage.removeItem('mto_ses')}catch(e){}}
function leerSesion(){try{var s=JSON.parse(sessionStorage.getItem('mto_ses')||'null');if(s){s.kraw=b64d(s.kraw);return s}}catch(e){}return null}
function claveValida(pw){return pw.length>=10&&/[a-zA-Z]/.test(pw)&&/\d/.test(pw)}
function usuarioValido(u){return /^[a-z0-9._-]{3,20}$/.test(u)}

/* ═════════ GitHub ═════════ */
async function gh(method,url,body,token){
  var r=await fetch('https://api.github.com'+url,{method:method,headers:{'Authorization':'Bearer '+(token||SES.token),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  var j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){var err=new Error((j&&j.message)||('HTTP '+r.status));err.status=r.status;throw err}
  return j;
}
function rutaRepo(){var parts=location.pathname.split('/').filter(Boolean);parts.shift();if(parts.length&&/\.html?$/i.test(parts[parts.length-1]))parts.pop();return parts.length?parts.join('/')+'/':''}
function api(cfg,path){return '/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+(rutaRepo()+path).split('/').map(encodeURIComponent).join('/')}
/* Lee el archivo más reciente, aplica el cambio y lo sube. cambio(textoActual|null) -> textoNuevo */
async function escribir(cfg,path,cambio,mensaje,token){
  for(var intento=0;intento<2;intento++){
    var f=null;
    try{f=await gh('GET',api(cfg,path)+'?ref='+encodeURIComponent(cfg.branch),null,token)}catch(e){if(e.status!==404)throw e}
    var nuevo=cambio(f?new TextDecoder().decode(b64d(f.content)):null);
    var body={message:mensaje,content:b64e(new TextEncoder().encode(nuevo)),branch:cfg.branch};
    if(f)body.sha=f.sha;
    try{await gh('PUT',api(cfg,path),body,token);return nuevo}catch(e){if(e.status!==409||intento===1)throw e}
  }
}
function errorTexto(e){
  if(e.status===401)return 'El token de GitHub ya no es válido o venció. El administrador debe renovarlo en Usuarios → Renovar token.';
  if(e.status===403||e.status===404)return 'El token no tiene permiso para escribir en el repositorio. Revisa que tenga "Contents: Read and write".';
  if(e.status===409)return 'Otra persona guardó al mismo tiempo. Intenta de nuevo.';
  if(e instanceof TypeError)return 'Sin conexión a internet. Intenta de nuevo.';
  return 'No se pudo guardar: '+e.message;
}
async function accion(fn,okTxt,despues){

  try{await fn();if(despues)despues();notice={ok:true,t:okTxt};limpiar=true}catch(e){notice={ok:false,t:errorTexto(e)}}
  busy=false;render();window.scrollTo({top:0,behavior:'smooth'});

/* ═════════ Resumen de todos los equipos (para el panel) ═════════ */
function resumen(st,id){
  if(!st)return {n:0,h:[],ult:null,mant:null,m30:0};
  var h=st.historial.slice().sort(function(a,b){return a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0});
  var m30=h.filter(function(x){var d=diasDesde(x.fecha);return esMant(x.tipo)&&d!==null&&d>=0&&d<=30}).length;
  return {n:h.length,ult:h[0]||null,mant:h.find(function(x){return esMant(x.tipo)})||null,m30:m30,h:h.slice(0,10).map(function(x){return {id:id,fecha:x.fecha,tipo:x.tipo,tecnico:x.tecnico}})};
}
async function cargarTodos(){
  if(cargandoTodos||!CAT.length)return;cargandoTodos=true;
  var ids=CAT.map(function(e){return e.id});
  var res=await Promise.all(ids.map(function(id){return txtFetch(DIR+id+'.txt').then(function(t){return t?leerEquipo(t):null}).catch(function(){return null})}));
  if(res.some(function(x){return !x})){ /* equipos que aún viven en datos.txt (versión anterior) */
    var viejo=await txtFetch(F_VIEJO).catch(function(){return null});
    if(viejo){var ve=leerEquipo(viejo);ids.forEach(function(id,i){if(!res[i]&&ve.equipo.id===id)res[i]=ve})}
  }
  var T={};ids.forEach(function(id,i){T[id]=resumen(res[i],id)});
  TODOS=T;cargandoTodos=false;
  if(enPanel()&&!EQID&&!busy){
    if(view==='equipos'&&$('cat-grid'))actualizarGrid(false);
    else if(view==='dash')render();
  }
}
function estadoEq(id){
  var r=TODOS&&TODOS[id];
  if(!r)return {c:'none',t:'Cargando…'};
  if(!r.mant)return {c:'none',t:r.n?'Sin mantenimiento':'Sin registros'};
  var d=diasDesde(r.mant.fecha);
  if(d!==null&&d>90)return {c:'w',t:'Hace '+d+' días'};
  return {c:'ok',t:'Al día'+(d!==null?' · '+(d===0?'hoy':'hace '+d+' d'):'')};
}

function contar(){
  document.querySelectorAll('[data-count]').forEach(function(el){
    var fin=+el.dataset.count;if(!(fin>0))return;var t0=null;
    function paso(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/700);el.textContent=Math.round(fin*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(paso)}

/* ═════════ Etiquetas QR (se generan en el navegador) ═════════ */
var qrLib=null;
function cargarQR(){if(qrLib)return qrLib;qrLib=new Promise(function(ok,err){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=function(){ok(window.qrcode)};s.onerror=function(){qrLib=null;err(new Error('qr'))};document.head.appendChild(s)});return qrLib}
function etiqueta(canvas,url,titulo,sub,oscuro){
  var qr=window.qrcode(0,'H');qr.addData(url);qr.make();
  var n=qr.getModuleCount(),cell=12,quiet=4,size=(n+quiet*2)*cell,top=110,bottom=110,W=size,H=size+top+bottom;
  canvas.width=W;canvas.height=H;var c=canvas.getContext('2d');
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
  c.fillStyle=oscuro?'#0a0a0a':'#f2b705';c.fillRect(0,0,W,top);
  c.fillStyle=oscuro?'#ffffff':'#000000';c.textAlign='center';c.textBaseline='middle';
  c.font='bold 44px Arial, sans-serif';c.fillText(titulo,W/2,42);
  c.font='26px Arial, sans-serif';c.fillText((EQID+' · '+EQ.equipo.nombre).slice(0,44),W/2,85);
  c.fillStyle='#000000';
  for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(qr.isDark(r,k))c.fillRect((k+quiet)*cell,top+(r+quiet)*cell,cell,cell);
  c.font='bold 26px Arial, sans-serif';c.fillText(sub,W/2,top+size+38);
  c.fillStyle='#555555';c.font='22px Arial, sans-serif';c.fillText('Mantenimiento Industrial · '+(EQ.equipo.ubicacion||''),W/2,top+size+80);
}

    if(!usuarioValido(nu))return aviso('El usuario debe tener de 3 a 20 letras minúsculas o números, sin espacios.');
    if(!nn&&existe)nn=existe.nombre;if(!nn)return aviso('Falta el nombre completo.');
    if(q1!==q2)return aviso('Las contraseñas no coinciden.');
    if(!claveValida(q1))return aviso('La contraseña debe tener al menos 10 caracteres, con letras y números.');
    busy=true;render();var nuevo=await envolverUsuario(SES.kraw,nu,nn,rol,q1);busy=false;
    await guardarConfig(function(c){var i=c.usuarios.findIndex(function(x){return x.u===nu});if(i>=0)c.usuarios[i]=nuevo;else c.usuarios.push(nuevo)},(existe?'Cambia contraseña de ':'Agrega usuario ')+nu,(existe?'Contraseña actualizada para ':'Usuario creado: ')+nu+'.');
    return;
  }
  if(id==='tfrm'&&esAdmin()){
    var nt=txt('t-token');if(!nt)return aviso('Pega el token nuevo.');
    busy=true;render();var tc=await cifrarToken(SES.kraw,nt);busy=false;var viejoTok=SES.token;SES.token=nt;
    await guardarConfig(function(c){c.tiv=tc.tiv;c.tct=tc.tct},'Renueva token de GitHub','Token renovado.');
    if(notice&&!notice.ok)SES.token=viejoTok;else guardarSesion();
    return;
  }
  if(id==='nfrm'&&esAdmin()){
    var nid=normId(txt('n-id')),nnom=txt('n-nombre'),nub=txt('n-ubic'),pl=plantilla(nid),ntipo=txt('n-tipo')||pl.tipo;
    if(!idValido(nid))return aviso('El ID debe ir en mayúsculas con guiones, por ejemplo CGR-CMP-054.');
    if(!nnom)return aviso('Falta el nombre del equipo.');
    if(CAT.some(function(x){return x.id===nid}))return aviso('Ya existe un equipo con el ID '+nid+'.');
    var st={equipo:{id:nid,nombre:nnom,tipo:ntipo,ubicacion:nub,area:'Mantenimiento Industrial'},placa:[['Marca','Por capturar'],['Modelo','Por capturar'],['No. de serie','Por capturar'],['Potencia','Por capturar'],['Voltaje','Por capturar'],['Año de fabricación','Por capturar']],checklist:pl.checklist.slice(),lecturas:pl.lecturas.map(function(x){return x.slice()}),historial:[]};
    await accion(async function(){
      await escribir(CFG,DIR+nid+'.txt',function(actual){return actual||escribirEquipo(st)},'Alta de equipo '+nid+' · '+SES.u);
      await guardarCatalogo({id:nid,nombre:nnom,ubicacion:nub,tipo:ntipo});
      if(TODOS)TODOS[nid]=resumen(null,nid);
    },'Equipo '+nid+' creado. Llena sus datos de placa y descarga sus etiquetas QR.',function(){history.pushState(null,'','?equipo='+encodeURIComponent(nid))});
    if(notice&&notice.ok){fichaTmp=null;await cargar('editar')}
    return;
  }
  if(id==='fichaf'&&esAdmin()){
    syncFicha();var t2=fichaTmp;
    t2.checklist=txt('e-check').split('\n').map(function(s){return s.trim()}).filter(Boolean);
    var usadas={};t2.lecturas=txt('e-lect').split('\n').map(function(s){return s.trim()}).filter(Boolean).map(function(s){
      var p=s.split('|'),nom=p[0].trim(),uni=(p[1]||'').trim(),old=EQ.lecturas.find(function(x){return x[1]===nom});
      var k=old?old[0]:(nom+(uni?'_'+uni:'')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/%/g,'pct').replace(/°/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
      while(usadas[k])k+='_2';usadas[k]=1;return [k,nom,uni]});
    var neq={nombre:txt('e-nombre'),tipo:txt('e-tipo'),ubicacion:txt('e-ubic')};
    if(!neq.nombre)return aviso('Falta el nombre del equipo.');
    await guardarEquipo(function(st){st.equipo.nombre=neq.nombre;st.equipo.tipo=neq.tipo;st.equipo.ubicacion=neq.ubicacion;st.placa=t2.placa.filter(function(p){return p[0]||p[1]});st.checklist=t2.checklist;st.lecturas=t2.lecturas},'Actualiza ficha','Ficha guardada.',function(){view='ficha';fichaTmp=null});
    if(notice&&notice.ok){try{await guardarCatalogo({id:EQID,nombre:neq.nombre,ubicacion:neq.ubicacion,tipo:neq.tipo});render()}catch(e){}}
    return;
  }
  if(id==='frm'){
    if(!txt('f-fecha'))return aviso('Falta la fecha.');
    var acts=EQ.checklist.filter(function(c,i){return $('c-'+i).checked});
    txt('f-otras').split('\n').map(function(s){return s.trim()}).filter(Boolean).forEach(function(s){acts.push(s)});
    if(!acts.length&&!txt('f-obs'))return aviso('Marca al menos una actividad o escribe qué se le hizo a la máquina.');
    var prev=editId?EQ.historial.find(function(x){return x.id===editId}):null,lec={};
    EQ.lecturas.forEach(function(x,i){var v=txt('l-'+i);if(v!=='')lec[x[0]]=tNum(v)});
    var reg={id:editId||('r'+Date.now().toString(36)),fecha:txt('f-fecha'),tipo:$('f-tipo').value,tecnico:prev?prev.tecnico:SES.nombre,usuario:prev?(prev.usuario||''):SES.u,horometro:num('f-horo'),actividades:acts,lectura:lec,refacciones:txt('f-ref'),obs:txt('f-obs')};
    await guardarEquipo(function(st){var i=st.historial.findIndex(function(x){return x.id===reg.id});if(i>=0)st.historial[i]=reg;else st.historial.push(reg)},(prev?'Edita':'Agrega')+' registro '+reg.fecha,(prev?'Cambios guardados.':'Registro guardado.')+' Quien escanee el QR lo verá en 1 a 2 minutos.',function(){editId=null;view='bitacora'});
  }
});
document.addEventListener('click',async function(ev){
  var link=ev.target.closest('a[data-eq]');
  if(link){if(ev.ctrlKey||ev.metaKey||ev.shiftKey||ev.button===1)return;ev.preventDefault();if(busy)return;irA(link.dataset.eq,link.dataset.v);return}
  var b=ev.target.closest('[data-act]');if(!b||busy)return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==='nav'){
    var v=b.dataset.v;menuOpen=false;
    if(GEN[v]&&EQID){irA(null,v);return}
    if(v==='editar')fichaTmp=EQ?clon(EQ):null;
    if(v==='form'&&view!=='form')editId=null;
    if(v!=='form')editId=null;
    notice=null;pendingDelete=null;pendingUser=null;view=v;render();window.scrollTo({top:0,behavior:'smooth'});
  }
  else if(a==='menu'){menuOpen=!menuOpen;render()}
  else if(a==='menu-close'){menuOpen=false;render()}
  else if(a==='toast-x'){cerrarToast()}
  else if(a==='pw'){var inp=$(b.dataset.for);if(inp){inp.type=inp.type==='password'?'text':'password';inp.focus()}}
  else if(a==='refresh'){TODOS=null;notice=null;cargar(view)}
  else if(a==='filtro'){filtro=b.dataset.f;lastKey=null;render()}
  else if(a==='guest'){guest=true;notice=null;view=EQID?'ficha':'dash';render()}
  else if(a==='login'){guest=false;view='login';notice=null;menuOpen=false;if(location.hash)history.replaceState(null,'',location.pathname+location.search);render()}
  else if(a==='config'){view='config';notice=null;render()}
  else if(a==='auth-back'){view='login';notice=null;if(location.hash)history.replaceState(null,'',location.pathname+location.search);render()}
  else if(a==='logout'){SES=null;guardarSesion();guest=false;view='login';editId=null;notice=null;menuOpen=false;if(location.hash)history.replaceState(null,'',location.pathname+location.search);render()}
  else if(a==='cancel-edit'){editId=null;view='bitacora';notice=null;render()}
  else if(a==='edit'){editId=id;view='form';notice=null;render();window.scrollTo({top:0,behavior:'smooth'})}
  else if(a==='del'){pendingDelete=id;render()}
  else if(a==='del-no'){pendingDelete=null;render()}
  else if(a==='del-ok'){pendingDelete=null;await guardarEquipo(function(st){st.historial=st.historial.filter(function(x){return x.id!==id})},'Elimina registro '+id,'Registro eliminado.')}
  else if(a==='u-del'){pendingUser=b.dataset.u;render()}
  else if(a==='u-del-no'){pendingUser=null;render()}
  else if(a==='u-del-ok'){var uu=b.dataset.u;pendingUser=null;await guardarConfig(function(c){c.usuarios=c.usuarios.filter(function(x){return x.u!==uu})},'Quita usuario '+uu,'Usuario quitado: '+uu+'.')}
  else if(a==='p-add'){syncFicha();fichaTmp.placa.push(['','']);render();var k=$('p-k-'+(fichaTmp.placa.length-1));if(k)k.focus()}
  else if(a==='p-del'){syncFicha();fichaTmp.placa.splice(+b.dataset.i,1);render()}
  else if(a==='qr-dl'){var cv=$(b.dataset.k==='pub'?'qr-pub':'qr-tec');if(!cv||!cv.width)return;var ln=document.createElement('a');ln.download='QR_'+(b.dataset.k==='pub'?'PUBLICO':'TECNICO')+'_'+EQID+'.png';ln.href=cv.toDataURL('image/png');document.body.appendChild(ln);ln.click();ln.remove()}
  else if(a==='migrar'&&esAdmin()&&LEGACY){
    var ve=window.__viejo;
    await accion(async function(){
      var c=clon(CFG);
      await escribir(c,F_CONFIG,function(actual){return actual||escribirConfig(c)},'Migra usuarios a config.txt');
      if(ve&&ve.equipo.id){
        await escribir(c,DIR+ve.equipo.id+'.txt',function(actual){return actual||escribirEquipo(ve)},'Migra '+ve.equipo.id+' a equipos/');
        await escribir(c,F_CATALOGO,function(actual){var cat=actual?leerCatalogo(actual):[];if(!cat.some(function(x){return x.id===ve.equipo.id}))cat.push({id:ve.equipo.id,nombre:ve.equipo.nombre,ubicacion:ve.equipo.ubicacion||'',tipo:ve.equipo.tipo||plantilla(ve.equipo.id).tipo});return escribirCatalogo(cat)},'Crea catálogo de equipos');
      }
    },'Sistema actualizado. Ya puedes registrar y dar de alta más equipos. Los cambios se ven en 1 a 2 minutos.');
    if(notice&&notice.ok){TODOS=null;await cargar()}
  }
});
function syncFicha(){if(!fichaTmp)return;fichaTmp.placa.forEach(function(p,i){var k=$('p-k-'+i),v=$('p-v-'+i);if(k&&v){p[0]=k.value.trim();p[1]=v.value.trim()}})}
window.addEventListener('popstate',function(){cargar()});
window.addEventListener('hashchange',function(){
  if(location.hash==='#tecnico'){if(SES){view=EQ&&!LEGACY?'form':view}else{guest=false;view='login'}render()}
  else if(location.hash==='#configurar'&&!SES){guest=false;view='config';render()}
});

/* Inicio: la etiqueta QR pública (?equipo=ID) abre la ficha directo en solo lectura; todo lo demás pide iniciar sesión */
SES=leerSesion();
(function(){
  var p=new URLSearchParams(location.search);
  if(!SES&&(p.get('equipo')||p.get('eq'))&&location.hash!=='#tecnico')guest=true;
  if(location.hash==='#configurar'&&!SES)view='config';
  else if(!SES&&!guest)view='login';
})();
cargar();
})();
</script>
