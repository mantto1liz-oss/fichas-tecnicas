<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Fichas Técnicas de Mantenimiento</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Placa de equipo con franja de seguridad, datos en rejilla, bitácora en tarjetas, modo técnico abajo */
:root{
  --bg:#f2f4f6; --surface:#ffffff; --ink:#151c24; --muted:#59667a; --line:#d5dbe3;
  --plate:#1f2a36; --plate-ink:#f4f6f8; --safety:#f2b705; --safety-ink:#1a1400;
  --ok:#1d7a4c; --warn:#a86400; --bad:#b3261e; --field:#f7f8fa;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1319; --surface:#161d26; --ink:#e6ebf1; --muted:#97a4b6; --line:#28323f;
  --plate:#1b2531; --plate-ink:#eef2f6; --safety:#f5c02a; --safety-ink:#1a1400;
  --ok:#4cc38a; --warn:#e2a03f; --bad:#f2827a; --field:#10161e; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 56px;display:grid;gap:18px}
.plate{background:var(--plate);color:var(--plate-ink);border-radius:10px;overflow:hidden}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--safety) 0 14px,var(--plate) 14px 28px)}
.plate-in{padding:16px 18px 18px;display:grid;gap:10px}
.eyebrow{font:600 12px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
h1{font:700 34px/1.05 var(--display);margin:0;text-wrap:balance}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{font:600 13px/1 var(--mono);padding:7px 9px;border-radius:6px;background:rgba(255,255,255,.12)}
.tag.id{background:var(--safety);color:var(--safety-ink)}
.status{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.stat .k{font:600 11px/1.2 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 20px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
h2{font:700 22px/1.1 var(--display);margin:0;text-transform:uppercase;display:flex;align-items:baseline;gap:10px}
h2 small{font:500 13px/1 var(--body);text-transform:none;color:var(--muted)}
section{display:grid;gap:10px}
dl.specs{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));background:var(--surface);border:1px solid var(--line);border-radius:10px}
dl.specs div{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);min-width:0}
dl.specs dt{color:var(--muted);font-size:13px}
dl.specs dd{margin:0;font:600 14px/1.4 var(--mono);text-align:right;overflow-wrap:anywhere}
.log{display:grid;gap:10px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;display:grid;gap:8px;min-width:0}
.entry-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
.date{font:600 15px/1 var(--mono)}
.pill{font:600 11px/1 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:99px;border:1px solid currentColor}
.pill.prev{color:var(--ok)} .pill.corr{color:var(--bad)} .pill.lect{color:var(--muted)} .pill.prue{color:var(--warn)}
.who{color:var(--muted);font-size:13px}
.entry ul{margin:0;padding-left:18px;font-size:14px}
.readings{display:flex;flex-wrap:wrap;gap:6px}
.rd{font:500 12px/1 var(--mono);padding:6px 8px;border-radius:6px;background:var(--field);border:1px solid var(--line)}
.rd.w{border-color:var(--warn);color:var(--warn)} .rd.b{border-color:var(--bad);color:var(--bad)}
.obs{font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{font-size:13px;color:var(--muted)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:20px;color:var(--muted);text-align:center}
button{font:600 14px/1 var(--body);border-radius:8px;padding:11px 16px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--safety);outline-offset:2px}
button.primary{background:var(--safety);color:var(--safety-ink);border-color:var(--safety)}
button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
button.small{padding:7px 10px;font-size:12px}
button:disabled{opacity:.55;cursor:default}
.techbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}
.panel{background:var(--surface);border:2px solid var(--safety);border-radius:10px;padding:16px;display:grid;gap:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
label.f{display:grid;gap:5px;font:600 12px/1.2 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);min-width:0}
input,select,textarea{font:500 15px/1.3 var(--mono);color:var(--ink);background:var(--field);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
textarea{font-family:var(--body);min-height:70px;resize:vertical}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:6px 8px;border-radius:6px;background:var(--field)}
.checks input{width:auto;margin-top:3px}
.legend{font:700 16px/1 var(--display);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:10px}
.msg{padding:10px 12px;border-radius:8px;font-size:14px;border:1px solid var(--line);background:var(--field)}
.msg.ok{border-color:var(--ok);color:var(--ok)} .msg.err{border-color:var(--bad);color:var(--bad)}
.spec-edit{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:center}
.help{font-size:13px;color:var(--muted);margin:0}
footer{font-size:12px;color:var(--muted);text-align:center}
@media (max-width:480px){h1{font-size:28px}.spec-edit{grid-template-columns:1fr}}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:600 13px/1 var(--body);padding:8px 12px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--plate);color:var(--plate-ink);border-color:var(--plate)}
.users{display:grid;gap:8px}
.urow{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--field)}
.grupo{font:600 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.sub{display:grid;gap:12px;border-top:1px solid var(--line);padding-top:14px}
input[readonly]{opacity:.8}
.cat{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.eq{display:grid;gap:6px;align-content:start;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);text-decoration:none;min-width:0}
.eq:hover,.eq:focus-visible{border-color:var(--safety);outline:none}
.eq .tag.id{justify-self:start}
.eq b{font:700 20px/1.15 var(--display);overflow-wrap:anywhere}
.back{color:var(--muted);text-decoration:none;font-size:14px;font-weight:600}
.back:hover{color:var(--ink)}
.qrs{display:flex;flex-wrap:wrap;gap:16px}
.qrs figure{margin:0;display:grid;gap:8px;justify-items:center;flex:1 1 220px}
.qrs canvas{width:100%;max-width:280px;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
</style>
</head>
<body>
<div id="app"></div>

<!-- Una sola página para todos los equipos: ?equipo=ID. Los datos están en equipos.txt, equipos/<ID>.txt y config.txt -->
<script>
(function(){
/* ═════════ Archivos del repositorio ═════════
   config.txt          usuarios y token cifrado (uno para todo el sistema)
   equipos.txt         catálogo: una línea por máquina
   equipos/<ID>.txt    ficha técnica + bitácora de cada máquina
   datos.txt           versión anterior (solo planta de emergencia); se migra sola  */
var F_CONFIG='config.txt', F_CATALOGO='equipos.txt', DIR='equipos/', F_VIEJO='datos.txt';
var IT=600000;
var CFG=null, LEGACY=false, CAT=[], EQ=null, EQID=null, EQSRC=null, SES=null;
var view='pub', editId=null, pendingDelete=null, pendingUser=null, notice=null, busy=false, filtro='todos', buscar='', fichaTmp=null, cargando=true;
var TIPOS=['Mantenimiento preventivo','Mantenimiento correctivo','Lectura / inspección','Prueba de funcionamiento','Limpieza'];
var FILTROS=[['todos','Todos'],['mant','Mantenimientos'],['corr','Correctivos'],['otros','Lecturas y pruebas']];
var PLANTILLAS={
  PEM:{tipo:'Planta de emergencia',
    checklist:['Nivel de aceite de motor','Nivel de refrigerante','Nivel de combustible y fugas','Bandas y mangueras','Indicador de filtro de aire','Bornes y voltaje de baterías (24 VCD)','Cargador de baterías operando','Calentador de motor operando','Arranque y operación en vacío 15–30 min','Transferencia en AUTOMÁTICO','Radiador limpio y sin obstrucciones','Limpieza general del área'],
    lecturas:[['combustible_pct','Combustible','%'],['presion_aceite_bar','Presión aceite','bar'],['temp_motor_c','Temp. motor','°C'],['baterias_v','Baterías','V'],['rpm','RPM','RPM'],['frecuencia_hz','Frecuencia','Hz'],['energia_kwh','Energía acumulada','kWh'],['v_linea_linea','V L-L (L1L2/L2L3/L3L1)','V'],['v_linea_neutro','V L-N (L1/L2/L3)','V']]},
  CMP:{tipo:'Compresor de aire',
    checklist:['Drenar condensados de tanque y separador','Revisar nivel de aceite','Revisar fugas de aire y aceite','Limpiar o cambiar filtro de aire','Revisar tensión y estado de bandas','Limpiar enfriador / radiador','Revisar presiones de carga y descarga','Revisar temperatura de descarga','Cambio de aceite','Cambio de filtro de aceite','Cambio de separador aire/aceite','Probar válvula de seguridad','Engrasar rodamientos del motor','Revisar conexiones eléctricas y amperaje'],
    lecturas:[['presion_carga_psi','Presión de carga','psi'],['presion_descarga_psi','Presión de descarga','psi'],['temp_descarga_c','Temp. descarga','°C'],['corriente_a','Corriente motor','A'],['horas_carga','Horas en carga','h']]},
  CLI:{tipo:'Aire acondicionado',
    checklist:['[Trimestral] Limpieza de filtros de la evaporadora','[Trimestral] Limpieza de serpentín evaporador y condensador','[Trimestral] Revisar y destapar drenaje de condensados','[Trimestral] Revisar presión de refrigerante','[Trimestral] Medir amperaje del compresor','[Trimestral] Revisar conexiones eléctricas y control remoto','[Trimestral] Limpieza de ventiladores y carcasa','[Trimestral] Prueba de funcionamiento y temperatura de salida'],
    lecturas:[['corriente_a','Corriente compresor','A'],['temp_salida_c','Temp. salida de aire','°C'],['presion_psi','Presión de refrigerante','psi']]},
  ELE:{tipo:'Electrodoméstico',
    checklist:['[Trimestral] Limpieza general interior y exterior','[Trimestral] Revisar cable de alimentación y clavija','[Trimestral] Revisar empaques y puertas','[Trimestral] Limpieza de rejillas / condensador','[Trimestral] Prueba de funcionamiento'],
    lecturas:[['temperatura_c','Temperatura','°C']]},
  GEN:{tipo:'Equipo industrial',
    checklist:['Inspección visual general','Limpieza','Lubricación','Revisión de conexiones eléctricas','Ajuste de tornillería','Prueba de funcionamiento'],
    lecturas:[['corriente_a','Corriente','A'],['temperatura_c','Temperatura','°C']]}
};
function plantilla(id){var p=String(id||'').split('-')[1];return PLANTILLAS[p]||PLANTILLAS.GEN}

/* ═════════ Utilidades ═════════ */
function $(id){return document.getElementById(id)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function hasN(v){return v!==null&&v!==undefined&&String(v)!==''}
function fmtF(f){if(!f)return '—';var p=String(f).split('-');if(p.length<3)return f;var m=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];return p[2]+' '+m[+p[1]-1]+' '+p[0]}
function esMant(t){return /preventivo|correctivo/i.test(t)}
function pillCls(t){return /preventivo/i.test(t)?'prev':/correctivo/i.test(t)?'corr':/prueba|inspec/i.test(t)?'prue':'lect'}
function val(k){var f=EQ.placa.find(function(p){return p[0].toLowerCase()===k.toLowerCase()});return f?f[1]:''}
function ordenado(){return EQ.historial.slice().sort(function(a,b){return a.fecha<b.fecha?1:a.fecha>b.fecha?-1:0})}
function esAdmin(){return SES&&SES.rol==='admin'}
function puedeEditar(e){return SES&&(esAdmin()||e.usuario===SES.u)}
function idValido(id){return /^[A-Z0-9]+(-[A-Z0-9]+)+$/.test(id)&&id.length<=30}
function normId(s){return String(s||'').toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,30)}
function baseURL(){return location.origin+location.pathname.replace(/[^/]*$/,'')}
function urlEquipo(id){return baseURL()+'?equipo='+encodeURIComponent(id)}
function txtFetch(p){return fetch(p+(p.indexOf('?')<0?'?':'&')+'v='+Date.now(),{cache:'no-store'}).then(function(r){if(r.status===404)return null;if(!r.ok)throw new Error('HTTP '+r.status);return r.text()})}

/* ═════════ Formato de texto (Bloc de notas) ═════════ */
function tEsc(v){return String(v==null?'':v).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n')}
function tUnesc(v){return v.replace(/\\(n|\\)/g,function(m,c){return c==='n'?'\n':'\\'})}
function tNum(v){return /^-?\d+(\.\d+)?$/.test(v)?Number(v):v}
function lineas(txt,cb){
  var sec=null,arg='';
  String(txt||'').replace(/^﻿/,'').split(/\r?\n/).forEach(function(raw){
    var l=raw.trim(); if(!l||l.charAt(0)==='#')return;
    var m=l.match(/^\[([A-ZÁÉÍÓÚa-z]+)\s*(.*)\]$/); if(m){sec=m[1].toUpperCase();arg=m[2].trim();cb(sec,arg,null,null,true);return}
    var i=l.indexOf('='); if(i<0)return;
    cb(sec,arg,l.slice(0,i).trim(),tUnesc(l.slice(i+1).trim()),false);
  });
}
/* config.txt (o la sección [CONFIG] de datos.txt) */
function leerConfig(txt){
  var c={},us=[],cur=null;
  lineas(txt,function(sec,arg,k,v,head){
    if(head){if(sec==='USUARIO'){cur={u:arg.toLowerCase(),nombre:'',rol:'tecnico',it:IT};us.push(cur)}return}
    if(sec==='CONFIG')c[k]=v;
    else if(sec==='USUARIO'){if(k==='nombre')cur.nombre=v;else if(k==='rol')cur.rol=v;else if(k==='sal')cur.s=v;else if(k==='iv')cur.iv=v;else if(k==='llave_cifrada')cur.ct=v;else if(k==='iteraciones')cur.it=Number(v)||IT}
  });
  if(!c.token_cifrado)return null;
  return {owner:c.cuenta_github,repo:c.repositorio,branch:c.rama||'main',tiv:c.token_iv,tct:c.token_cifrado,usuarios:us};
}
function escribirConfig(c){
  var L=['# ==========================================================','# CONFIGURACIÓN DEL MODO TÉCNICO · Fichas técnicas de mantenimiento','# Todo va cifrado. No modifiques este archivo a mano.','# ==========================================================',''];
  function kv(k,v){L.push(k+' = '+tEsc(v))}
  L.push('[CONFIG]');kv('cuenta_github',c.owner);kv('repositorio',c.repo);kv('rama',c.branch);kv('token_iv',c.tiv);kv('token_cifrado',c.tct);L.push('');
  c.usuarios.forEach(function(u){L.push('[USUARIO '+u.u+']');kv('nombre',u.nombre);kv('rol',u.rol);kv('sal',u.s);kv('iv',u.iv);kv('llave_cifrada',u.ct);kv('iteraciones',u.it);L.push('')});
  return L.join('\r\n');
}
/* equipos.txt: ID = nombre | ubicación | tipo */
function leerCatalogo(txt){
  var out=[];
  lineas(txt,function(sec,arg,k,v,head){if(head||!k)return;var p=v.split('|');out.push({id:normId(k),nombre:(p[0]||'').trim(),ubicacion:(p[1]||'').trim(),tipo:(p[2]||'').trim()})});
  return out;
}
function escribirCatalogo(cat){
  var L=['# ==========================================================','# CATÁLOGO DE EQUIPOS ('+cat.length+')','# Formato:  ID = Nombre | Ubicación | Tipo','# Cada equipo tiene su archivo en la carpeta equipos/','# ==========================================================',''];
  cat.slice().sort(function(a,b){return a.id<b.id?-1:1}).forEach(function(e){L.push(e.id+' = '+[e.nombre,e.ubicacion,e.tipo].map(function(x){return tEsc(x).replace(/\|/g,'/')}).join(' | '))});
  return L.join('\r\n')+'\r\n';
}
/* equipos/<ID>.txt */
function leerEquipo(txt){
  var st={equipo:{},placa:[],checklist:[],lecturas:[],historial:[]},cur=null;
  lineas(txt,function(sec,arg,k,v,head){
    if(head){if(sec==='REGISTRO'){cur={id:'',fecha:'',tipo:'',tecnico:'',usuario:'',horometro:null,actividades:[],lectura:{},refacciones:'',obs:''};st.historial.push(cur)}return}
    if(sec==='EQUIPO')st.equipo[k]=v;
    else if(sec==='PLACA')st.placa.push([k,v]);
    else if(sec==='CHECKLIST')st.checklist.push(v);
    else if(sec==='LECTURAS'){var p=v.split('|');st.lecturas.push([k,(p[0]||k).trim(),(p[1]||'').trim()])}
    else if(sec==='REGISTRO'){
      if(k==='id'||k==='fecha'||k==='tipo'||k==='tecnico'||k==='usuario'||k==='refacciones')cur[k]=v;
      else if(k==='actividad')cur.actividades.push(v);
      else if(k==='horometro')cur.horometro=v===''?null:tNum(v);
      else if(k==='observaciones')cur.obs=v;
      else cur.lectura[k]=tNum(v);
    }
  });
  var pl=plantilla(st.equipo.id);
  if(!st.checklist.length)st.checklist=pl.checklist.slice();
  if(!st.lecturas.length)st.lecturas=pl.lecturas.map(function(x){return x.slice()});
  st.historial.forEach(function(r,i){if(!r.id)r.id='r'+(i+1)});
  return st;
}
function escribirEquipo(st){
  var L=[],q=st.equipo,h=st.historial.slice().sort(function(a,b){return a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0});
  function kv(k,v){L.push(k+' = '+tEsc(v))}
  L.push('# ==========================================================','# FICHA TÉCNICA Y BITÁCORA DE MANTENIMIENTO','# Equipo: '+tEsc(q.id)+' · '+tEsc(q.nombre),'# Actualizado: '+new Date().toLocaleString('es-MX'),'# Formato  campo = valor . Las líneas con # son comentarios.','# ==========================================================','');
  L.push('[EQUIPO]');['id','nombre','tipo','ubicacion','area'].concat(Object.keys(q).filter(function(k){return ['id','nombre','tipo','ubicacion','area'].indexOf(k)<0})).forEach(function(k){if(q[k]!==undefined)kv(k,q[k])});L.push('');
  L.push('[PLACA]');st.placa.forEach(function(p){kv(String(p[0]).replace(/=/g,'-'),p[1])});L.push('');
  L.push('[CHECKLIST]');st.checklist.forEach(function(c){kv('actividad',c)});L.push('');
  L.push('[LECTURAS]');st.lecturas.forEach(function(x){kv(x[0],x[1]+' | '+x[2])});L.push('');
  L.push('# ---------------- ÍNDICE DE REGISTROS ('+h.length+') ----------------','# No.  | Fecha      | Tipo                       | Técnico');
  h.forEach(function(r,i){L.push('# '+String(i+1).padStart(4,'0')+' | '+r.fecha+' | '+(r.tipo+'                          ').slice(0,26)+' | '+tEsc(r.tecnico))});
  L.push('');
  h.forEach(function(r,i){
    L.push('[REGISTRO '+String(i+1).padStart(4,'0')+']');
    kv('id',r.id);kv('fecha',r.fecha);kv('tipo',r.tipo);kv('tecnico',r.tecnico);if(r.usuario)kv('usuario',r.usuario);
    kv('horometro',hasN(r.horometro)?r.horometro:'');
    (r.actividades||[]).forEach(function(a){kv('actividad',a)});
    Object.keys(r.lectura||{}).forEach(function(k){if(hasN(r.lectura[k]))kv(k,r.lectura[k])});
    if(r.refacciones)kv('refacciones',r.refacciones);
    if(r.obs)kv('observaciones',r.obs);
    L.push('');
  });
  return L.join('\r\n');
}

/* ═════════ Cifrado: token cifrado con llave maestra; cada usuario guarda la llave cifrada con su contraseña ═════════ */
function b64e(u8){var s='';for(var i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s)}
function b64d(s){var b=atob(String(s).replace(/\s/g,'')),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function llavePw(pw,salt,it){var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
function llaveMaestra(raw){return crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt'])}
async function aesCifrar(key,bytes){var iv=crypto.getRandomValues(new Uint8Array(12));var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,bytes));return {iv:b64e(iv),ct:b64e(ct)}}
async function aesDescifrar(key,iv,ct){return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(iv)},key,b64d(ct)))}
async function envolverUsuario(kraw,u,nombre,rol,pw){var salt=crypto.getRandomValues(new Uint8Array(16)),k=await llavePw(pw,salt,IT),e=await aesCifrar(k,kraw);return {u:u,nombre:nombre,rol:rol,s:b64e(salt),iv:e.iv,ct:e.ct,it:IT}}
async function cifrarToken(kraw,token){var e=await aesCifrar(await llaveMaestra(kraw),new TextEncoder().encode(token));return {tiv:e.iv,tct:e.ct}}
async function entrar(u,pw){
  var us=CFG.usuarios.find(function(x){return x.u===u}); if(!us)throw new Error('x');
  var kraw=await aesDescifrar(await llavePw(pw,b64d(us.s),us.it),us.iv,us.ct);
  var token=new TextDecoder().decode(await aesDescifrar(await llaveMaestra(kraw),CFG.tiv,CFG.tct));
  return {u:us.u,nombre:us.nombre,rol:us.rol,token:token,kraw:kraw};
}

function leerSesion(){try{var s=JSON.parse(sessionStorage.getItem('mto_ses')||'null');if(s){s.kraw=b64d(s.kraw);return s}}catch(e){}return null}

/* ═════════ GitHub ═════════ */
async function gh(method,url,body,token){
  var r=await fetch('https://api.github.com'+url,{method:method,headers:{'Authorization':'Bearer '+(token||SES.token),'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body:body?JSON.stringify(body):undefined,cache:'no-store'});
  var j=null;try{j=await r.json()}catch(e){}
  if(!r.ok){var err=new Error((j&&j.message)||('HTTP '+r.status));err.status=r.status;throw err}
  return j;
}
function rutaRepo(){var parts=location.pathname.split('/').filter(Boolean);parts.shift();if(parts.length&&/\.html?$/i.test(parts[parts.length-1]))parts.pop();return parts.length?parts.join('/')+'/':''}
function api(cfg,path){return '/repos/'+encodeURIComponent(cfg.owner)+'/'+encodeURIComponent(cfg.repo)+'/contents/'+(rutaRepo()+path).split('/').map(encodeURIComponent).join('/')}
/* Lee el archivo más reciente, aplica el cambio y lo sube. cambio(textoActual|null) -> textoNuevo */
async function escribir(cfg,path,cambio,mensaje,token){
  for(var intento=0;intento<2;intento++){
    var f=null;
    try{f=await gh('GET',api(cfg,path)+'?ref='+encodeURIComponent(cfg.branch),null,token)}catch(e){if(e.status!==404)throw e}
    var nuevo=cambio(f?new TextDecoder().decode(b64d(f.content)):null);
    var body={message:mensaje,content:b64e(new TextEncoder().encode(nuevo)),branch:cfg.branch};
    if(f)body.sha=f.sha;
    try{await gh('PUT',api(cfg,path),body,token);return nuevo}catch(e){if(e.status!==409||intento===1)throw e}
  }
}
function errorTexto(e){
  if(e.status===401)return 'El token de GitHub ya no es válido o venció. El administrador debe renovarlo en Usuarios → Renovar token.';
  if(e.status===403||e.status===404)return 'El token no tiene permiso para escribir en el repositorio. Revisa que tenga "Contents: Read and write".';
  if(e.status===409)return 'Otra persona guardó al mismo tiempo. Intenta de nuevo.';
  if(e instanceof TypeError)return 'Sin conexión a internet. Intenta de nuevo.';
  return 'No se pudo guardar: '+e.message;
}

  if(cargando){$('app').innerHTML=html+'<div class="empty">Cargando…</div></main>';return}
  if(!EQID){ /* Catálogo */
    var q=buscar.toLowerCase(),lista=CAT.filter(function(e){return !q||(e.id+' '+e.nombre+' '+e.ubicacion+' '+e.tipo).toLowerCase().indexOf(q)>=0});
    html+='<header class="plate"><div class="stripe"></div><div class="plate-in"><span class="eyebrow">Mantenimiento Industrial</span><h1>Fichas técnicas de equipos</h1><div class="tags"><span class="tag id">'+CAT.length+' equipos</span></div></div></header>'+msgHTML();
    if(LEGACY&&esAdmin())html+=migrarHTML();
    if(view==='login'&&!SES)html+=loginHTML();
    if(view==='config')html+=configHTML();
    if(view==='nuevo'&&esAdmin())html+=nuevoEqHTML('');
    if(view==='usuarios'&&esAdmin())html+=usuariosHTML();
    html+='<section><label class="f">Buscar equipo<input id="buscar" value="'+esc(buscar)+'" placeholder="ID, nombre o ubicación" autocomplete="off"></label>'+
     (lista.length?'<div class="cat">'+lista.map(function(e){return '<a class="eq" href="?equipo='+encodeURIComponent(e.id)+'" data-eq="'+esc(e.id)+'"><span class="tag id">'+esc(e.id)+'</span><b>'+esc(e.nombre)+'</b><span class="meta">'+esc([e.tipo,e.ubicacion].filter(Boolean).join(' · '))+'</span></a>'}).join('')+'</div>'
       :'<div class="empty">'+(CAT.length?'Ningún equipo coincide con la búsqueda.':'Todavía no hay equipos en el catálogo.')+'</div>')+'</section>';
    html+=techbar()+'<footer>Mantenimiento Industrial</footer></main>';
    $('app').innerHTML=html;return;
  }
  html+='<a class="back" href="./" data-act="catalogo">← Todos los equipos</a>';
  if(!EQ){
    html+='<header class="plate"><div class="stripe"></div><div class="plate-in"><span class="eyebrow">Equipo no encontrado</span><h1>'+esc(EQID)+'</h1></div></header>'+msgHTML()+
      '<div class="empty">Este equipo todavía no tiene ficha. '+(esAdmin()?'Dalo de alta abajo.':'Avisa al jefe de mantenimiento.')+'</div>';
    if(view==='login'&&!SES)html+=loginHTML();
    if(esAdmin()&&!LEGACY)html+=nuevoEqHTML(EQID);
    html+=techbar()+'</main>';$('app').innerHTML=html;return;
  }
  var e=EQ.equipo,h=ordenado(),hf=h.filter(pasaFiltro);
  html+='<header class="plate"><div class="stripe"></div><div class="plate-in"><span class="eyebrow">'+esc([e.ubicacion,e.tipo].filter(Boolean).join(' · '))+'</span><h1>'+esc(e.nombre)+'</h1>'+
   '<div class="tags"><span class="tag id">'+esc(e.id)+'</span>'+['Marca','Modelo','Potencia','Voltaje'].map(function(k){var v=val(k);return v&&!/por capturar/i.test(v)?'<span class="tag">'+esc(v)+'</span>':''}).join('')+'</div></div></header>'+
   msgHTML()+(LEGACY&&esAdmin()?migrarHTML():'')+(LEGACY&&SES&&!esAdmin()?'<div class="msg err">El administrador debe actualizar el sistema antes de que se puedan guardar registros.</div>':'')+statusHTML()+
   '<section><h2>Ficha técnica</h2><dl class="specs">'+EQ.placa.map(function(p){return '<div><dt>'+esc(p[0])+'</dt><dd>'+esc(p[1])+'</dd></div>'}).join('')+'</dl></section>';
  if(view==='config')html+=configHTML();
  if(view==='login'&&!SES)html+=loginHTML();
  if(SES&&!LEGACY){
    if(view==='ficha'&&esAdmin())html+=fichaHTML();
    if(view==='qr'&&esAdmin())html+=qrHTML();
    if(view==='usuarios'&&esAdmin())html+=usuariosHTML();
    if(view==='form')html+=formHTML();
  }
  html+='<section><h2>Mantenimientos realizados <small>'+hf.length+' de '+h.length+'</small></h2>'+
   '<div class="chips" role="group" aria-label="Filtrar historial">'+FILTROS.map(function(f){return '<button class="chip" data-act="filtro" data-f="'+f[0]+'" aria-pressed="'+(filtro===f[0])+'">'+f[1]+'</button>'}).join('')+'</div>'+
   (hf.length?'<div class="log">'+hf.map(entryHTML).join('')+'</div>':'<div class="empty">'+(h.length?'No hay registros de este tipo.':'Todavía no hay mantenimientos registrados.')+'</div>')+'</section>';
  html+=techbar()+'<footer>'+esc(e.area||'Mantenimiento Industrial')+' · '+esc(e.ubicacion||'')+'</footer></main>';
  $('app').innerHTML=html;
  if(view==='login'&&$('lg-u')&&!busy)$('lg-u').focus();
  if(view==='qr')dibujarQRs();
}

/* ═════════ Etiquetas QR (se generan en el navegador) ═════════ */
var qrLib=null;
function cargarQR(){if(qrLib)return qrLib;qrLib=new Promise(function(ok,err){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js';s.onload=function(){ok(window.qrcode)};s.onerror=function(){qrLib=null;err(new Error('qr'))};document.head.appendChild(s)});return qrLib}
function etiqueta(canvas,url,titulo,sub,oscuro){
  var qr=window.qrcode(0,'H');qr.addData(url);qr.make();
  var n=qr.getModuleCount(),cell=12,quiet=4,size=(n+quiet*2)*cell,top=110,bottom=110,W=size,H=size+top+bottom;
  canvas.width=W;canvas.height=H;var c=canvas.getContext('2d');
  c.fillStyle='#ffffff';c.fillRect(0,0,W,H);
  c.fillStyle=oscuro?'#1f2a36':'#f2b705';c.fillRect(0,0,W,top);
  c.fillStyle=oscuro?'#ffffff':'#000000';c.textAlign='center';c.textBaseline='middle';
  c.font='bold 44px Arial, sans-serif';c.fillText(titulo,W/2,42);
  c.font='26px Arial, sans-serif';c.fillText((EQID+' · '+EQ.equipo.nombre).slice(0,44),W/2,85);
  c.fillStyle='#000000';
  for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(qr.isDark(r,k))c.fillRect((k+quiet)*cell,top+(r+quiet)*cell,cell,cell);
  c.font='bold 26px Arial, sans-serif';c.fillText(sub,W/2,top+size+38);
  c.fillStyle='#555555';c.font='22px Arial, sans-serif';c.fillText('Mantenimiento Industrial · '+(EQ.equipo.ubicacion||''),W/2,top+size+80);
}
function dibujarQRs(){
  cargarQR().then(function(){
    var a=$('qr-pub'),b=$('qr-tec');if(!a||!b)return;
    etiqueta(a,urlEquipo(EQID),'FICHA TÉCNICA','Escanea para ver datos e historial',true);
    etiqueta(b,urlEquipo(EQID)+'#tecnico','MODO TÉCNICO','Solo mantenimiento · requiere usuario',false);
  }).catch(function(){notice={ok:false,t:'No se pudo cargar el generador de QR. Revisa tu conexión.'};view='form';render()});
}

/* ═════════ Carga ═════════ */
async function cargar(){
  cargando=true;render();
  var p=new URLSearchParams(location.search);EQID=normId(p.get('equipo')||p.get('eq')||'')||null;
  var r=await Promise.all([txtFetch(F_CONFIG).catch(function(){return null}),txtFetch(F_CATALOGO).catch(function(){return null}),EQID?txtFetch(DIR+EQID+'.txt').catch(function(){return null}):null]);
  CFG=r[0]?leerConfig(r[0]):null;CAT=r[1]?leerCatalogo(r[1]):[];EQ=r[2]?leerEquipo(r[2]):null;EQSRC=r[2]?'nuevo':null;LEGACY=false;
  if(!CFG||(!EQ&&EQID)||!r[1]){ /* versión anterior: datos.txt */
    var viejo=await txtFetch(F_VIEJO).catch(function(){return null});
    if(viejo){
      var vc=leerConfig(viejo),ve=leerEquipo(viejo);
      if(!CFG&&vc){CFG=vc;LEGACY=true}
      if(!r[1]&&ve.equipo.id&&!CAT.some(function(x){return x.id===ve.equipo.id}))CAT.push({id:ve.equipo.id,nombre:ve.equipo.nombre,ubicacion:ve.equipo.ubicacion||'',tipo:ve.equipo.tipo||plantilla(ve.equipo.id).tipo});
      if(!EQ&&EQID===ve.equipo.id){EQ=ve;EQSRC='viejo'}
      if(LEGACY)window.__viejo=ve;
    }
  }
  cargando=false;
  if(location.hash==='#tecnico')view=SES?'form':'login';else if(location.hash==='#configurar')view='config';else if(SES&&EQ)view='form';else view='pub';
  render();
}
function irA(id){
  history.pushState(null,'',id?'?equipo='+encodeURIComponent(id):location.pathname);
  notice=null;editId=null;filtro='todos';window.scrollTo({top:0});cargar();
}

/* ═════════ Eventos ═════════ */
function num(id){var v=$(id).value.trim();return v===''?null:tNum(v)}
function txt(id){return $(id).value.trim()}
function aviso(t){notice={ok:false,t:t};render();window.scrollTo({top:0})}

document.addEventListener('input',function(ev){if(ev.target.id==='buscar'){buscar=ev.target.value;var pos=ev.target.selectionStart;render();var b=$('buscar');b.focus();try{b.setSelectionRange(pos,pos)}catch(e){}}});
document.addEventListener('submit',async function(ev){
  ev.preventDefault();if(busy)return;var id=ev.target.id;
  if(id==='login'){
    var u=txt('lg-u').toLowerCase(),pw=$('lg-pw').value;busy=true;render();
    try{SES=await entrar(u,pw);guardarSesion();view=EQ?'form':'pub';notice={ok:true,t:'Bienvenido, '+SES.nombre+'.'}}catch(e){notice={ok:false,t:'Usuario o contraseña incorrectos.'}}
    busy=false;render();return;
  }
  if(id==='cfgf'){
    var cfg={owner:txt('g-owner'),repo:txt('g-repo'),branch:txt('g-branch')||'main',usuarios:[]},tok=txt('g-token'),au=txt('a-u').toLowerCase(),an=txt('a-nombre'),p1=$('a-pw').value,p2=$('a-pw2').value;
    if(!cfg.owner||!cfg.repo||!tok)return aviso('Faltan la cuenta de GitHub, el repositorio o el token.');
    if(!usuarioValido(au))return aviso('El usuario debe tener de 3 a 20 letras minúsculas o números, sin espacios.');
    if(!an)return aviso('Falta el nombre del administrador.');
    if(p1!==p2)return aviso('Las contraseñas no coinciden.');
    if(!claveValida(p1))return aviso('La contraseña debe tener al menos 10 caracteres, con letras y números.');
    busy=true;render();
    var kraw=crypto.getRandomValues(new Uint8Array(32)),t=await cifrarToken(kraw,tok);cfg.tiv=t.tiv;cfg.tct=t.tct;cfg.usuarios=[await envolverUsuario(kraw,au,an,'admin',p1)];busy=false;
    await accion(async function(){await escribir(cfg,F_CONFIG,function(){return escribirConfig(cfg)},'Configura modo técnico',tok);CFG=cfg;SES={u:au,nombre:an,rol:'admin',token:tok,kraw:kraw};guardarSesion();view='usuarios'},'Configuración guardada. Ahora da de alta a los técnicos.');
    return;
  }
  if(id==='ufrm'&&esAdmin()){
    var nu=txt('u-u').toLowerCase(),nn=txt('u-nombre'),rol=$('u-rol').value,q1=$('u-pw').value,q2=$('u-pw2').value,existe=CFG.usuarios.find(function(x){return x.u===nu});
    if(!usuarioValido(nu))return aviso('El usuario debe tener de 3 a 20 letras minúsculas o números, sin espacios.');
    if(!nn&&existe)nn=existe.nombre;if(!nn)return aviso('Falta el nombre completo.');
    if(q1!==q2)return aviso('Las contraseñas no coinciden.');
    if(!claveValida(q1))return aviso('La contraseña debe tener al menos 10 caracteres, con letras y números.');
    busy=true;render();var nuevo=await envolverUsuario(SES.kraw,nu,nn,rol,q1);busy=false;
    await guardarConfig(function(c){var i=c.usuarios.findIndex(function(x){return x.u===nu});if(i>=0)c.usuarios[i]=nuevo;else c.usuarios.push(nuevo)},(existe?'Cambia contraseña de ':'Agrega usuario ')+nu,(existe?'Contraseña actualizada para ':'Usuario creado: ')+nu+'.');
    return;
  }
  if(id==='tfrm'&&esAdmin()){
    var nt=txt('t-token');if(!nt)return aviso('Pega el token nuevo.');
    busy=true;render();var tc=await cifrarToken(SES.kraw,nt);busy=false;var viejoTok=SES.token;SES.token=nt;
    await guardarConfig(function(c){c.tiv=tc.tiv;c.tct=tc.tct},'Renueva token de GitHub','Token renovado.');
    if(notice&&!notice.ok)SES.token=viejoTok;else guardarSesion();
    return;
  }
  if(id==='nfrm'&&esAdmin()){
    var nid=normId(txt('n-id')),nnom=txt('n-nombre'),nub=txt('n-ubic'),pl=plantilla(nid),ntipo=txt('n-tipo')||pl.tipo;
    if(!idValido(nid))return aviso('El ID debe ir en mayúsculas con guiones, por ejemplo CGR-CMP-054.');
    if(!nnom)return aviso('Falta el nombre del equipo.');
    if(CAT.some(function(x){return x.id===nid}))return aviso('Ya existe un equipo con el ID '+nid+'.');
    var st={equipo:{id:nid,nombre:nnom,tipo:ntipo,ubicacion:nub,area:'Mantenimiento Industrial'},placa:[['Marca','Por capturar'],['Modelo','Por capturar'],['No. de serie','Por capturar'],['Potencia','Por capturar'],['Voltaje','Por capturar'],['Año de fabricación','Por capturar']],checklist:pl.checklist.slice(),lecturas:pl.lecturas.map(function(x){return x.slice()}),historial:[]};
    await accion(async function(){
      await escribir(CFG,DIR+nid+'.txt',function(actual){return actual||escribirEquipo(st)},'Alta de equipo '+nid+' · '+SES.u);
      await guardarCatalogo({id:nid,nombre:nnom,ubicacion:nub,tipo:ntipo});
    },'Equipo '+nid+' creado. Llena sus datos de placa con "Editar ficha" y descarga sus etiquetas QR.',function(){history.pushState(null,'','?equipo='+encodeURIComponent(nid))});
    if(notice&&notice.ok){var keep=notice;await cargar();notice=keep;view='ficha';fichaTmp=JSON.parse(JSON.stringify(EQ));render()}
    return;
  }
  if(id==='fichaf'&&esAdmin()){
    syncFicha();var t2=fichaTmp;
    t2.checklist=txt('e-check').split('\n').map(function(s){return s.trim()}).filter(Boolean);
    var usadas={};t2.lecturas=txt('e-lect').split('\n').map(function(s){return s.trim()}).filter(Boolean).map(function(s){
      var p=s.split('|'),nom=p[0].trim(),uni=(p[1]||'').trim(),old=EQ.lecturas.find(function(x){return x[1]===nom});
      var k=old?old[0]:(nom+(uni?'_'+uni:'')).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/%/g,'pct').replace(/°/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
      while(usadas[k])k+='_2';usadas[k]=1;return [k,nom,uni]});
    var neq={nombre:txt('e-nombre'),tipo:txt('e-tipo'),ubicacion:txt('e-ubic')};
    if(!neq.nombre)return aviso('Falta el nombre del equipo.');
    await guardarEquipo(function(st){st.equipo.nombre=neq.nombre;st.equipo.tipo=neq.tipo;st.equipo.ubicacion=neq.ubicacion;st.placa=t2.placa.filter(function(p){return p[0]||p[1]});st.checklist=t2.checklist;st.lecturas=t2.lecturas},'Actualiza ficha','Ficha guardada.',function(){view='form'});
    if(notice&&notice.ok){try{await guardarCatalogo({id:EQID,nombre:neq.nombre,ubicacion:neq.ubicacion,tipo:neq.tipo})}catch(e){}}
    return;
  }
  if(id==='frm'){
    if(!txt('f-fecha'))return aviso('Falta la fecha.');
    var acts=EQ.checklist.filter(function(c,i){return $('c-'+i).checked});
    txt('f-otras').split('\n').map(function(s){return s.trim()}).filter(Boolean).forEach(function(s){acts.push(s)});
    if(!acts.length&&!txt('f-obs'))return aviso('Marca al menos una actividad o escribe qué se le hizo a la máquina.');
    var prev=editId?EQ.historial.find(function(x){return x.id===editId}):null,lec={};
    EQ.lecturas.forEach(function(x,i){var v=txt('l-'+i);if(v!=='')lec[x[0]]=tNum(v)});
    var reg={id:editId||('r'+Date.now().toString(36)),fecha:txt('f-fecha'),tipo:$('f-tipo').value,tecnico:prev?prev.tecnico:SES.nombre,usuario:prev?(prev.usuario||''):SES.u,horometro:num('f-horo'),actividades:acts,lectura:lec,refacciones:txt('f-ref'),obs:txt('f-obs')};
    await guardarEquipo(function(st){var i=st.historial.findIndex(function(x){return x.id===reg.id});if(i>=0)st.historial[i]=reg;else st.historial.push(reg)},(prev?'Edita':'Agrega')+' registro '+reg.fecha,(prev?'Cambios guardados.':'Registro guardado.')+' Quien escanee el QR lo verá en 1 a 2 minutos.',function(){editId=null});
  }
});
document.addEventListener('click',async function(ev){
  var link=ev.target.closest('a[data-eq]');if(link){ev.preventDefault();irA(link.dataset.eq);return}
  var b=ev.target.closest('[data-act]');if(!b||busy)return;
  var a=b.dataset.act,id=b.dataset.id;
  if(a==='catalogo'){ev.preventDefault();irA(null)}
  else if(a==='filtro'){filtro=b.dataset.f;render()}
  else if(a==='login'){view='login';notice=null;render()}
  else if(a==='config'){view='config';notice=null;render()}
  else if(a==='cerrar'){view=SES&&EQ?'form':'pub';notice=null;if(location.hash)history.replaceState(null,'',location.pathname+location.search);render()}
  else if(a==='logout'){SES=null;guardarSesion();view='pub';editId=null;notice=null;if(location.hash)history.replaceState(null,'',location.pathname+location.search);render()}
  else if(a==='go-form'){view='form';editId=null;render()}
  else if(a==='go-ficha'){fichaTmp=JSON.parse(JSON.stringify(EQ));view='ficha';render()}
  else if(a==='go-qr'){view='qr';render()}
  else if(a==='go-nuevo'){view='nuevo';render()}
  else if(a==='go-usuarios'){view='usuarios';pendingUser=null;notice=null;render()}
  else if(a==='cancel-edit'){editId=null;render()}
  else if(a==='edit'){editId=id;view='form';render();$('frm').scrollIntoView({block:'start'})}
  else if(a==='del'){pendingDelete=id;render()}
  else if(a==='del-no'){pendingDelete=null;render()}
  else if(a==='del-ok'){pendingDelete=null;await guardarEquipo(function(st){st.historial=st.historial.filter(function(x){return x.id!==id})},'Elimina registro '+id,'Registro eliminado.')}
  else if(a==='u-del'){pendingUser=b.dataset.u;render()}
  else if(a==='u-del-no'){pendingUser=null;render()}
  else if(a==='u-del-ok'){var uu=b.dataset.u;pendingUser=null;await guardarConfig(function(c){c.usuarios=c.usuarios.filter(function(x){return x.u!==uu})},'Quita usuario '+uu,'Usuario quitado: '+uu+'.')}
  else if(a==='p-add'){syncFicha();fichaTmp.placa.push(['','']);render()}
  else if(a==='p-del'){syncFicha();fichaTmp.placa.splice(+b.dataset.i,1);render()}
  else if(a==='qr-dl'){var cv=$(b.dataset.k==='pub'?'qr-pub':'qr-tec');if(!cv||!cv.width)return;var ln=document.createElement('a');ln.download='QR_'+(b.dataset.k==='pub'?'PUBLICO':'TECNICO')+'_'+EQID+'.png';ln.href=cv.toDataURL('image/png');document.body.appendChild(ln);ln.click();ln.remove()}
  else if(a==='migrar'&&esAdmin()&&LEGACY){
    var ve=window.__viejo;
    await accion(async function(){
      var c=JSON.parse(JSON.stringify(CFG));
      await escribir(c,F_CONFIG,function(actual){return actual||escribirConfig(c)},'Migra usuarios a config.txt');
      if(ve&&ve.equipo.id){
        await escribir(c,DIR+ve.equipo.id+'.txt',function(actual){return actual||escribirEquipo(ve)},'Migra '+ve.equipo.id+' a equipos/');
        await escribir(c,F_CATALOGO,function(actual){var cat=actual?leerCatalogo(actual):[];if(!cat.some(function(x){return x.id===ve.equipo.id}))cat.push({id:ve.equipo.id,nombre:ve.equipo.nombre,ubicacion:ve.equipo.ubicacion||'',tipo:ve.equipo.tipo||plantilla(ve.equipo.id).tipo});return escribirCatalogo(cat)},'Crea catálogo de equipos');
      }
    },'Sistema actualizado. Ya puedes registrar y dar de alta más equipos. Los cambios se ven en 1 a 2 minutos.');
    if(notice&&notice.ok){var keep=notice;await cargar();notice=keep;render()}
  }
});
function syncFicha(){if(!fichaTmp)return;fichaTmp.placa.forEach(function(p,i){var k=$('p-k-'+i),v=$('p-v-'+i);if(k&&v){p[0]=k.value.trim();p[1]=v.value.trim()}})}
window.addEventListener('popstate',function(){cargar()});
window.addEventListener('hashchange',function(){if(location.hash==='#tecnico'){view=SES?'form':'login';render()}else if(location.hash==='#configurar'){view='config';render()}});
SES=leerSesion();
cargar();
})();
